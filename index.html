<body>
<canvas id="game"></canvas>
<div id="hint">WASD 移动 · J 连斩三连 · 攻击中接 K 突进斩 / J→J→K 回旋斩 · L/右键 举盾格挡（起手瞬间挡中=完美格挡） · K 翻滚 · Shift 冲刺 · F 复仇之魂 · R 饮原素瓶 · Tab 锁定 · E 休息 / 交易 · 滚轮或 +/− 调视野</div>
<script>
'use strict';

// ============================================================
//  灰烬回响 · Ashen Echo
//  单文件魂类小游戏（Canvas 2D，零依赖）
// ============================================================

// ---------------- 数学工具 ----------------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function angleDiff(a, b) {
  let d = (a - b) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}
function angleLerp(a, b, t) {
  return a + angleDiff(b, a) * t;
}

// ---------------- 画布 ----------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
const DPR = Math.min(2, window.devicePixelRatio || 1);
const touch = { joyId: null, joyX: 0, joyY: 0, joyCX: 0, joyCY: 0, active: false };
const TOUCH_BTNS = [];

// ---------------- 视野缩放 ----------------
let zoom = 1.15;        // 当前缩放（1.15 = 默认视野，比 1.0 略近）
let zoomTarget = 1.15;  // 目标缩放，平滑趋近
const ZOOM_MIN = 0.65;
const ZOOM_MAX = 1.9;
const ZOOM_DEFAULT = 1.15;
function bumpZoom(f) {
  zoomTarget = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoomTarget * f));
}

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if (typeof layoutTouchButtons === 'function') layoutTouchButtons();
}
resize();
window.addEventListener('resize', resize);

// ---------------- 输入 ----------------
const keys = Object.create(null);
const pressed = Object.create(null);

window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (!keys[k]) pressed[k] = true;
  keys[k] = true;
  if (k === ' ' || k === 'tab' || k.startsWith('arrow')) e.preventDefault();
  if (k === '=' || k === '+' || k === ']') bumpZoom(1.12);
  if (k === '-' || k === '_' || k === '[') bumpZoom(1 / 1.12);
  if (k === '0') zoomTarget = ZOOM_DEFAULT;
  initAudio();
});
window.addEventListener('keyup', (e) => {
  keys[e.key.toLowerCase()] = false;
});
window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
});
canvas.addEventListener('mousedown', (e) => {
  initAudio();
  if (e.button === 0) pressed['mouse'] = true;
  if (e.button === 2) keys['mouse2'] = true;
});
window.addEventListener('mouseup', (e) => {
  if (e.button === 2) keys['mouse2'] = false;
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  bumpZoom(e.deltaY > 0 ? 1 / 1.1 : 1.1);
}, { passive: false });

// ---------------- 触屏（手机虚拟摇杆 + 按键） ----------------
function layoutTouchButtons() {
  TOUCH_BTNS.length = 0;
  const R = Math.max(28, Math.min(W, H) * 0.062);
  const cx = W - R * 1.7;
  const cy = H - R * 1.7;
  TOUCH_BTNS.push({ key: 'j', label: '斩', x: cx, y: cy, r: R * 1.3, col: '#dce6f5', fill: 'rgba(58,78,108,0.6)' });
  TOUCH_BTNS.push({ key: 'shift', label: '冲', x: cx, y: cy - R * 3.1, r: R, col: '#9fdcf5', fill: 'rgba(40,70,100,0.55)' });
  TOUCH_BTNS.push({ key: 'k', label: '滚', x: cx - R * 2.7, y: cy, r: R, col: '#b8c8dc', fill: 'rgba(50,64,90,0.55)' });
  TOUCH_BTNS.push({ key: 'f', label: '魂', x: cx - R * 2.5, y: cy - R * 2.8, r: R * 0.95, col: '#c8b0ff', fill: 'rgba(62,52,104,0.55)' });
  TOUCH_BTNS.push({ key: 'r', label: '瓶', x: cx - R * 4.6, y: cy + R * 0.1, r: R * 0.85, col: '#f0b98a', fill: 'rgba(92,62,42,0.55)' });
  TOUCH_BTNS.push({ key: 'e', label: 'E', x: cx - R * 4.4, y: cy - R * 2.4, r: R * 0.85, col: '#ffd89a', fill: 'rgba(92,76,42,0.55)' });
  TOUCH_BTNS.push({ key: 'block', label: '挡', x: cx - R * 4.5, y: cy - R * 4.3, r: R * 0.95, col: '#b6e0ff', fill: 'rgba(46,72,96,0.6)' });
  // 视野缩放（放在右上角，避开战斗区）
  TOUCH_BTNS.push({ key: 'zoomin', label: '＋', x: W - R * 1.2, y: R * 1.7, r: R * 0.78, col: '#cfe0f0', fill: 'rgba(40,54,74,0.5)' });
  TOUCH_BTNS.push({ key: 'zoomout', label: '－', x: W - R * 3.1, y: R * 1.7, r: R * 0.78, col: '#cfe0f0', fill: 'rgba(40,54,74,0.5)' });
}
function inButton(x, y) {
  for (const b of TOUCH_BTNS) {
    if (Math.hypot(x - b.x, y - b.y) < b.r * 1.15) return b;
  }
  return null;
}
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  initAudio();
  for (const t of e.changedTouches) {
    const b = inButton(t.clientX, t.clientY);
    if (b) {
      pressed[b.key] = true;
      keys[b.key] = true;
      b.flash = 0.12;
      continue;
    }
    if (t.clientX < W * 0.5 && t.clientY > H * 0.45 && touch.joyId === null) {
      touch.joyId = t.identifier;
      touch.joyCX = t.clientX;
      touch.joyCY = t.clientY;
      touch.joyX = 0;
      touch.joyY = 0;
      touch.active = true;
    }
  }
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier !== touch.joyId) continue;
    const dx = t.clientX - touch.joyCX;
    const dy = t.clientY - touch.joyCY;
    const len = Math.hypot(dx, dy) || 1;
    const max = 52;
    const k = len > max ? max / len : 1;
    touch.joyX = (dx * k) / max;
    touch.joyY = (dy * k) / max;
  }
}, { passive: false });
function endTouch(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === touch.joyId) {
      touch.joyId = null;
      touch.joyX = 0;
      touch.joyY = 0;
      touch.active = false;
    }
    for (const b of TOUCH_BTNS) {
      if (keys[b.key] && b.key !== 'j') keys[b.key] = false;
    }
  }
}
canvas.addEventListener('touchend', endTouch, { passive: false });
canvas.addEventListener('touchcancel', endTouch, { passive: false });
const IS_TOUCH = ('ontouchstart' in window) || (typeof navigator !== 'undefined' && navigator.maxTouchPoints > 0);

function clearPressed() {
  for (const k in pressed) delete pressed[k];
}

// ---------------- 音频（Web Audio 合成，无需外部文件） ----------------
let actx = null;
function initAudio() {
  if (actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (err) {
    actx = null;
  }
  if (actx) startMusic();
}
function tone(freq, dur, type, vol, slideTo) {
  if (!actx) return;
  type = type || 'sine';
  vol = (vol === undefined || vol === null) ? 0.12 : vol;
  const t0 = actx.currentTime;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(actx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.03);
}
function noiseBurst(dur, vol, cutoff) {
  if (!actx) return;
  const len = Math.max(1, Math.floor(actx.sampleRate * dur));
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = actx.createBufferSource();
  src.buffer = buf;
  const f = actx.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.value = cutoff || 1500;
  const g = actx.createGain();
  g.gain.value = vol || 0.08;
  src.connect(f).connect(g).connect(actx.destination);
  src.start();
}
const sfx = {
  swing() { noiseBurst(0.1, 0.05, 3200); },
  hit() { tone(130, 0.09, 'square', 0.1, 55); noiseBurst(0.07, 0.07, 900); },
  hurt() { tone(90, 0.22, 'sawtooth', 0.12, 45); },
  roll() { noiseBurst(0.16, 0.05, 700); },
  die() { tone(200, 1.4, 'sine', 0.16, 50); },
  victory() {
    tone(330, 0.25, 'sine', 0.12);
    setTimeout(() => tone(494, 0.3, 'sine', 0.1), 160);
    setTimeout(() => tone(660, 0.6, 'sine', 0.1), 340);
  },
  soul() {
    tone(700, 0.07, 'sine', 0.07);
    setTimeout(() => tone(1050, 0.12, 'sine', 0.05), 70);
  },
  bonfire() { noiseBurst(0.5, 0.04, 400); tone(160, 0.5, 'sine', 0.06); },
  bossRoar() { tone(60, 0.8, 'sawtooth', 0.14, 30); },
  dash() { noiseBurst(0.14, 0.06, 1400); },
  spell() {
    tone(420, 0.28, 'triangle', 0.12, 180);
    noiseBurst(0.22, 0.05, 2200);
  },
  spellHit() { tone(180, 0.18, 'square', 0.1, 70); noiseBurst(0.12, 0.06, 1600); },
  block() { tone(240, 0.09, 'square', 0.09, 120); noiseBurst(0.09, 0.06, 2400); },
  parry() {
    tone(880, 0.1, 'triangle', 0.13, 620);
    tone(1320, 0.18, 'sine', 0.09);
    noiseBurst(0.14, 0.07, 3600);
  },
  guardBreak() { tone(110, 0.3, 'sawtooth', 0.13, 60); noiseBurst(0.2, 0.07, 800); },
};

let player = null;

// ---------------- 实体构造 ----------------

// ---------------- 碰撞辅助 ----------------
function resolveObstacles(ent) {
  for (const o of obstacles) {
    const dx = ent.x - o.x;
    const dy = ent.y - o.y;
    const d = Math.hypot(dx, dy);
    const min = ent.r + o.r;
    if (d < min && d > 0.001) {
      ent.x = o.x + dx / d * min;
      ent.y = o.y + dy / d * min;
    }
  }
  ent.x = clamp(ent.x, ent.r, WORLD.w - ent.r);
  ent.y = clamp(ent.y, ent.r, WORLD.h - ent.r);
}

function pushApart(list) {
  for (let i = 0; i < list.length; i++) {
    for (let j = i + 1; j < list.length; j++) {
      const a = list[i];
      const b = list[j];
      if (a.dead || b.dead) continue;
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const d = Math.hypot(dx, dy);
      const min = a.r + b.r;
      if (d > 0.001 && d < min) {
        const push = (min - d) / 2;
        a.x -= dx / d * push;
        a.y -= dy / d * push;
        b.x += dx / d * push;
        b.y += dy / d * push;
      }
    }
  }
}

// ---------------- 特效与飘字 ----------------
function addFloater(x, y, text, color) {
  floaters.push({ x, y, text: String(text), color, life: 1.1, vy: -34 });
}
function makeSlashEffect(x, y, ang, color, scale) {
  return {
    kind: 'slash', x, y, ang,
    color: color || '#ffe0a0',
    scale: scale || 1,
    life: 0.22, maxLife: 0.22,
  };
}
function makeShockwave(x, y, color) {
  return { kind: 'shock', x, y, color: color || '#ffb06a', life: 0.5, maxLife: 0.5 };
}
function makeDeathPuff(x, y, color) {
  return { kind: 'puff', x, y, color: color || '#9be7ff', life: 0.6, maxLife: 0.6 };
}
function addEffect(e) { effects.push(e); }

function updateEffects(dt) {
  for (const e of effects) e.life -= dt;
  effects = effects.filter(e => e.life > 0);
}
function updateFloaters(dt) {
  for (const f of floaters) {
    f.y += f.vy * dt;
    f.life -= dt;
    f.vy *= 0.96;
  }
  floaters = floaters.filter(f => f.life > 0);
}

// ---------------- 玩家行为 ----------------
function toggleLock() {
  if (lockTarget && !lockTarget.dead) {
    lockTarget = null;
    return;
  }
  let best = null;
  let bestD = 720;
  const all = enemies.slice();
  if (boss && !boss.dead && boss.aggro) all.push(boss);
  for (const e of all) {
    if (e.dead) continue;
    const d = dist(player, e);
    if (d < bestD) { bestD = d; best = e; }
  }
  lockTarget = best;
}

function startRoll(p, ix, iy) {
  let dx = ix;
  let dy = iy;
  if (!dx && !dy) {
    dx = Math.cos(p.facing);
    dy = Math.sin(p.facing);
  }
  p.state = 'roll';
  p.stateT = 0;
  p.rollDx = dx;
  p.rollDy = dy;
  p.facing = Math.atan2(dy, dx);
  p.stamina -= 25;
  p.staminaDelay = 0.7;
  p.invuln = 0.34;
  p.attackHitDone = true;
  sfx.roll();
}

function startAttack(p, chain) {
  if (chain && p.combo < COMBO.length - 1) {
    p.combo++;
  } else if (!chain && p.comboT > 0 && p.combo < COMBO.length - 1) {
    p.combo++;
  } else {
    p.combo = 0;
  }
  p.comboT = 0;
  p.comboQueued = false;
  const c = COMBO[p.combo] || COMBO[0];
  p.state = 'attack';
  p.stateT = 0;
  p.attackId++;
  p.attackHitDone = false;
  p.stamina -= c.stamina;
  p.staminaDelay = 0.7;
  if (lockTarget && !lockTarget.dead) {
    p.facing = Math.atan2(lockTarget.y - p.y, lockTarget.x - p.x);
  } else {
    // 软锁定：前方小角度内最近的敌人自动瞄准
    let best = null;
    let bestD = 1e9;
    const all = enemies.slice();
    if (boss && !boss.dead && boss.aggro) all.push(boss);
    for (const e of all) {
      if (e.dead) continue;
      const d = dist(p, e);
      const a = Math.atan2(e.y - p.y, e.x - p.x);
      if (d < 170 && Math.abs(angleDiff(a, p.facing)) < 1.0 && d < bestD) {
        bestD = d;
        best = e;
      }
    }
    if (best) p.facing = Math.atan2(best.y - p.y, best.x - p.x);
  }
  if (p.combo === 1) addFloater(p.x, p.y - 26, '反手斩', '#cfe4ff');
  else if (p.combo === 2) addFloater(p.x, p.y - 26, '重劈', '#ffd89a');
  sfx.swing();
}

// ---------------- 冲刺与法术（参考空洞骑士的手感层） ----------------
function startDash(p, ix, iy) {
  let dx = ix;
  let dy = iy;
  if (!dx && !dy) {
    dx = Math.cos(p.facing);
    dy = Math.sin(p.facing);
  }
  const l = Math.hypot(dx, dy) || 1;
  dx /= l;
  dy /= l;
  p.state = 'dash';
  p.stateT = 0;
  p.dashDx = dx;
  p.dashDy = dy;
  p.facing = Math.atan2(dy, dx);
  p.dashCd = 0.55;
  p.stamina -= 14;
  p.staminaDelay = 0.6;
  p.invuln = Math.max(p.invuln, 0.16);
  sfx.dash();
}

function startCast(p) {
  p.state = 'cast';
  p.stateT = 0;
  p.castDone = false;
  p.soul -= 33;
  if (lockTarget && !lockTarget.dead) {
    p.facing = Math.atan2(lockTarget.y - p.y, lockTarget.x - p.x);
  }
  sfx.spell();
}

function fireSpell(p) {
  const speed = 340;
  projectiles.push({
    x: p.x + Math.cos(p.facing) * 14,
    y: p.y + Math.sin(p.facing) * 14,
    vx: Math.cos(p.facing) * speed,
    vy: Math.sin(p.facing) * speed,
    r: 9,
    dmg: 26,
    life: 1.0,
    maxLife: 1.0,
    hitList: [],
    ang: p.facing,
  });
}

function updateProjectiles(dt) {
  for (const s of projectiles) {
    s.life -= dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    for (const o of obstacles) {
      if (Math.hypot(s.x - o.x, s.y - o.y) < o.r + s.r * 0.5) s.life = 0;
    }
    if (s.x < 0 || s.y < 0 || s.x > WORLD.w || s.y > WORLD.h) s.life = 0;
    const all = enemies.slice();
    if (boss && !boss.dead && boss.aggro) all.push(boss);
    for (const e of all) {
      if (e.dead || s.hitList.indexOf(e) >= 0) continue;
      if (Math.hypot(e.x - s.x, e.y - s.y) < e.r + s.r) {
        s.hitList.push(e);
        damageEnemy(e, s.dmg, s.ang);
        addEffect(makeShockwave(s.x, s.y, '#9be7ff'));
        game.hitStop = Math.max(game.hitStop, 0.045);
        game.shake = Math.max(game.shake, 6);
        sfx.spellHit();
        s.life = 0;
      }
    }
  }
  projectiles = projectiles.filter(s => s.life > 0);
}

// ---------------- 敌人的远程攻击 ----------------
let eProjectiles = [];

function fireEnemyShot(e) {
  const a = Math.atan2(player.y - e.y, player.x - e.x);
  eProjectiles.push({
    x: e.x + Math.cos(a) * 14,
    y: e.y + Math.sin(a) * 14 - 4,
    vx: Math.cos(a) * 250,
    vy: Math.sin(a) * 250,
    ang: a,
    r: 4,
    dmg: e.dmg,
    life: 2.6,
    owner: e,
  });
  addEffect(makeSlashEffect(e.x + Math.cos(a) * 18, e.y + Math.sin(a) * 18, a, '#a8e6c0'));
  sfx.swing();
}

function updateEProjectiles(dt) {
  for (const s of eProjectiles) {
    s.life -= dt;
    if (s.life <= 0) continue;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    if (s.x < 0 || s.y < 0 || s.x > WORLD.w || s.y > WORLD.h) {
      s.life = 0;
      continue;
    }
    for (const o of obstacles) {
      if (Math.hypot(s.x - o.x, s.y - o.y) < o.r + s.r * 0.5) {
        s.life = 0;
        addEffect(makeDeathPuff(s.x, s.y, '#8a8f99'));
        break;
      }
    }
    if (s.life <= 0) continue;
    if (!player.dead && player.invuln <= 0 &&
      Math.hypot(player.x - s.x, player.y - s.y) < player.r + s.r) {
      const r = damagePlayer(s.dmg, s.x, s.y);
      if (r === 'parry') {
        // 完美格挡把箭弹开
        addEffect(makeShockwave(s.x, s.y, '#ffe9a0'));
      } else {
        addEffect(makeShockwave(s.x, s.y, '#ff9a6a'));
      }
      s.life = 0;
      continue;
    }
    // 箭矢也会误伤别的敌人（友军伤害）
    for (const e of enemies) {
      if (e.dead || e === s.owner) continue;
      if (Math.hypot(e.x - s.x, e.y - s.y) < e.r + s.r) {
        damageEnemy(e, Math.max(1, Math.round(s.dmg * 0.7)), Math.atan2(s.vy, s.vx), false);
        addEffect(makeDeathPuff(s.x, s.y, '#c8d0da'));
        s.life = 0;
        break;
      }
    }
  }
  eProjectiles = eProjectiles.filter(s => s.life > 0);
}

function drawEProjectiles() {
  for (const s of eProjectiles) {
    if (!visible(s.x, s.y, 20)) continue;
    G.save();
    G.translate(s.x, s.y);
    G.rotate(s.ang);
    px(-8, -1, 12, 2, '#6b5232');
    px(2, -1, 5, 2, '#c9d4e0');
    px(7, 0, 3, 1, '#eef4fa');
    px(-10, -2, 3, 4, '#9ad6b0');
    G.restore();
  }
}

  keen:  { name: '细刃刺剑', dmg: 0.86, reach: 0.94, spd: 1.28, price: 180, tint: '#cfe0f0', desc: '轻而快，挥砍间隔明显更短。' },
  great: { name: '守墓巨剑', dmg: 1.50, reach: 1.16, spd: 0.78, price: 260, tint: '#b8b09a', desc: '沉重缓慢，一击即可破盾。' },
  ember: { name: '余烬之刃', dmg: 1.28, reach: 1.06, spd: 0.96, price: 430, tint: '#ffb070', desc: '刃上余火未熄，灼烧敌人。' },
};
const SHOP_ITEMS = [
  { id: 'flask', name: '原素瓶 ×1', price: 90, desc: '携带上限 +1，并补满' },
  { id: 'heal', name: '炽热血瓶', price: 40, desc: '立刻回满生命' },
  { id: 'soul', name: '魂之容器', price: 120, desc: '灵魂上限 +30' },
  { id: 'stamina', name: '耐力药剂', price: 100, desc: '耐力上限 +15' },
];
const vendor = { x: 724, y: 1266, r: 12, bob: 0 };

function wpn() { return WEAPONS[player && player.weapon] || WEAPONS.iron; }
function atkDmg(c) { return Math.round(c.dmg * wpn().dmg); }
function atkReach(c) { return c.reach * wpn().reach; }
function atkTotal(c) { return c.total / wpn().spd; }

function shopList() {
  const list = SHOP_ITEMS.map((it) => ({ id: it.id, name: it.name, price: it.price, desc: it.desc, owned: false, kind: 'item' }));
  for (const id in WEAPONS) {
    const w = WEAPONS[id];
    if (!w.price) continue;
    list.push({
      id: 'w:' + id,
      name: w.name,
      price: w.price,
      desc: w.desc,
      kind: 'weapon',
      weapon: id,
      owned: player.ownedWeapons.indexOf(id) >= 0,
      equipped: player.weapon === id,
    });
  }
  return list;
}

// 连招分支技：J+K 突进斩，J+J+K 回旋斩
const SPECIALS = {
  dash: { dmg: 22, reach: 34, hitR: 36, stamina: 22, dur: 0.4, moveSpeed: 520, name: '突进斩' },
  spin: { dmg: 18, reach: 30, hitR: 46, stamina: 26, dur: 0.5, name: '回旋斩' },
};

function startDashSlash(p) {
  p.state = 'dashslash';
  p.stateT = 0;
  p.attackId++;
  p.attackHitDone = false;
  p.dashDx = Math.cos(p.facing);
  p.dashDy = Math.sin(p.facing);
  p.stamina -= SPECIALS.dash.stamina;
  p.staminaDelay = 0.8;
  p.invuln = Math.max(p.invuln, 0.16);
  p.combo = 0;
  p.comboT = 0;
  addFloater(p.x, p.y - 26, '突进斩', '#bfe8ff');
  sfx.dash();
}

function startSpin(p) {
  p.state = 'spin';
  p.stateT = 0;
  p.attackId++;
  p.attackHitDone = false;
  p.spinHit2 = false;
  p.stamina -= SPECIALS.spin.stamina;
  p.staminaDelay = 0.85;
  p.invuln = Math.max(p.invuln, 0.1);
  p.combo = 0;
  p.comboT = 0;
  addFloater(p.x, p.y - 26, '回旋斩', '#ffe0a0');
  sfx.swing();
}

function playerSpecialHit(kind) {
  const p = player;
  const s = kind === 'spin' ? SPECIALS.spin : SPECIALS.dash;
  p.attackId++;
  const cx = kind === 'spin' ? p.x : p.x + Math.cos(p.facing) * s.reach;
  const cy = kind === 'spin' ? p.y : p.y + Math.sin(p.facing) * s.reach;
  const sdmg = Math.round(s.dmg * wpn().dmg);
  let hitAny = false;
  const all = enemies.slice();
  if (boss && !boss.dead && boss.aggro) all.push(boss);
  for (const e of all) {
    if (e.dead || e.lastAttackId === p.attackId) continue;
    if (Math.hypot(e.x - cx, e.y - cy) < s.hitR + e.r) {
      e.lastAttackId = p.attackId;
      const a = Math.atan2(e.y - p.y, e.x - p.x);
      damageEnemy(e, sdmg, a);
      e.x += Math.cos(a) * 12;
      e.y += Math.sin(a) * 12;
      hitAny = true;
    }
  }
  if (hitAny) {
    game.hitStop = Math.max(game.hitStop, 0.07);
    game.shake = Math.max(game.shake, 9);
    addEffect(makeSlashEffect(cx, cy, kind === 'spin' ? p.stateT * 18 : p.facing));
    if (kind === 'spin') addEffect(makeShockwave(p.x, p.y, '#ffe6b0'));
  }
}

// 三段连招：轻斩 → 反手斩 → 重劈
const COMBO = [
  { dmg: 15, reach: 42, hitR: 30, hitAt: 0.09, total: 0.34, stamina: 16, shake: 6, kb: 10, arc: 1.9, spin: 1 },
  { dmg: 15, reach: 44, hitR: 31, hitAt: 0.08, total: 0.30, stamina: 15, shake: 6, kb: 14, arc: 2.2, spin: -1 },
  { dmg: 30, reach: 56, hitR: 40, hitAt: 0.15, total: 0.54, stamina: 24, shake: 13, kb: 34, arc: 2.6, spin: 1 },
];

function playerAttackHit() {
  const p = player;
  const c = COMBO[p.combo] || COMBO[0];
  const reach = atkReach(c);
  const cx = p.x + Math.cos(p.facing) * reach;
  const cy = p.y + Math.sin(p.facing) * reach;
  const hitR = c.hitR;
  let hitAny = false;
  const all = enemies.slice();
  if (boss && !boss.dead && boss.aggro) all.push(boss);
  for (const e of all) {
    if (e.dead) continue;
    if (e.lastAttackId === p.attackId) continue;
    if (Math.hypot(e.x - cx, e.y - cy) < hitR + e.r) {
      e.lastAttackId = p.attackId;
      damageEnemy(e, atkDmg(c), p.facing);
      if (c.kb > 16) {
        e.x += Math.cos(p.facing) * (c.kb - 16);
        e.y += Math.sin(p.facing) * (c.kb - 16);
      }
      hitAny = true;
    }
  }
  if (hitAny) {
    game.hitStop = p.combo === 2 ? 0.1 : 0.055;
    game.shake = Math.max(game.shake, c.shake);
    addEffect(makeSlashEffect(cx, cy, p.facing));
    if (p.combo === 2) addEffect(makeShockwave(cx, cy, '#ffe6b0'));
  }
}

function damageEnemy(e, dmg, dir, byPlayer) {
  if (e.dead) return;
  if (byPlayer === undefined) byPlayer = true;
  // 盾兵：正面格挡，重劈可破防
  if (e.shield && e.guardT <= 0) {
    const front = Math.abs(angleDiff(dir, e.facing + Math.PI)) < 1.15;
    if (front) {
      if (dmg >= 28) {
        e.guardT = 1.6;
        addFloater(e.x, e.y - e.r - 8, '破防', '#ffd89a');
        game.shake = Math.max(game.shake, 9);
        game.hitStop = Math.max(game.hitStop, 0.08);
        addEffect(makeShockwave(e.x, e.y, '#ffe6b0'));
      } else {
        const chip = Math.max(1, Math.round(dmg * 0.15));
        e.hp -= chip;
        e.flash = 0.1;
        addFloater(e.x, e.y - e.r - 8, '格挡 -' + chip, '#cfe0ff');
        addEffect(makeShockwave(e.x, e.y, '#9fc6e8'));
        sfx.hit();
        // 举盾格挡时被打会打断出招，并往后顶一步
        if (e.state === 'windup' || e.state === 'active') {
          e.state = 'stagger';
          e.stateT = 0;
          e.hitDone = true;
          e.x += Math.cos(dir) * 2;
          e.y += Math.sin(dir) * 2;
        }
        if (e.hp <= 0) killEnemy(e, byPlayer);
        return;
      }
    }
  }
  e.hp -= dmg;
  e.flash = 0.14;
  if (byPlayer) player.soul = Math.min(player.soulMax, player.soul + 8);
  if (e !== boss) {
    e.state = 'stagger';
    e.stateT = 0;
  }
  const kb = e === boss ? 5 : 16;
  e.x += Math.cos(dir) * kb;
  e.y += Math.sin(dir) * kb;
  addFloater(e.x, e.y - e.r - 6, '-' + dmg, byPlayer ? '#ffe08a' : '#ff9aa0');
  sfx.hit();
  if (e.hp <= 0) killEnemy(e, byPlayer);
}

function killEnemy(e, byPlayer) {
  if (e === boss) {
    if (bossDefeated) return;
    bossDefeated = true;
    boss.dead = true;
    boss.hp = 0;
    player.souls += 600;
    game.state = 'victory';
    game.victoryTimer = 0;
    lockTarget = null;
    sfx.victory();
    addEffect(makeShockwave(boss.x, boss.y, '#c9a0ff'));
    addEffect(makeDeathPuff(boss.x, boss.y, '#b48cff'));
    return;
  }
  if (e.dead) return;
  e.dead = true;
  e.hp = 0;
  if (byPlayer !== false) {
    player.souls += e.souls;
    addFloater(e.x, e.y - e.r, '+' + e.souls, '#9be7ff');
  } else {
    addFloater(e.x, e.y - e.r, '误伤致死', '#ff9aa0');
  }
  addEffect(makeDeathPuff(e.x, e.y, e.color));
  sfx.soul();
}

function damagePlayer(dmg, sx, sy) {
  const p = player;
  if (p.dead || p.invuln > 0) return 'none';

  // 举盾格挡：攻击来自正面才有效
  if (p.state === 'block') {
    const ang = (sx === undefined) ? p.facing : Math.atan2(sy - p.y, sx - p.x);
    const fromFront = Math.abs(angleDiff(ang, p.facing)) < 1.5;
    if (fromFront) {
      if (p.parryWin > 0) {
        // 完美格挡：零伤害、回魂、敌人硬直（由调用方处理）
        p.parryWin = 0;
        p.invuln = 0.25;
        p.soul = Math.min(p.soulMax, p.soul + 18);
        game.hitStop = 0.09;
        game.shake = Math.max(game.shake, 9);
        game.parryFlash = 0.22;
        addFloater(p.x, p.y - p.r - 8, '完美格挡', '#ffe9a0');
        addEffect({ kind: 'shock', x: p.x, y: p.y, life: 0.42, maxLife: 0.42, color: '#ffe9a0' });
        sfx.parry();
        return 'parry';
      }
      if (p.stamina >= 20) {
        // 普通格挡：扣耐力，伤害只剩 15%
        p.stamina -= 20;
        p.staminaDelay = 0.6;
        const reduced = Math.max(1, Math.round(dmg * 0.15));
        p.hp -= reduced;
        p.invuln = 0.35;
        game.shake = Math.max(game.shake, 6);
        game.hitStop = 0.04;
        addFloater(p.x, p.y - p.r - 8, '格挡 -' + reduced, '#cfe0f0');
        addEffect({ kind: 'puff', x: p.x + Math.cos(p.facing) * 16, y: p.y + Math.sin(p.facing) * 16, life: 0.3, maxLife: 0.3, color: '#cfe0f0' });
        sfx.block();
        if (p.hp <= 0) {
          p.hp = 0;
          killPlayer();
        }
        return 'block';
      }
      // 耐力不够：破防，吃满伤害且硬直更久
      p.stamina = 0;
      p.staminaDelay = 1.1;
      p.staggerT = 0.75;
      addFloater(p.x, p.y - p.r - 8, '破防', '#ff9a6a');
      sfx.guardBreak();
    }
  }

  p.hp -= dmg;
  p.invuln = 0.8;
  p.flash = 0.25;
  p.soul = Math.max(0, p.soul - 10);
  game.shake = Math.max(game.shake, 14);
  game.hitStop = 0.05;
  addFloater(p.x, p.y - p.r - 4, '-' + dmg, '#ff6b6b');
  sfx.hurt();
  if (p.hp <= 0) {
    p.hp = 0;
    killPlayer();
  } else {
    p.state = 'hurt';
    p.stateT = 0;
  }
  return 'hit';
}

function killPlayer() {
  const p = player;
  p.dead = true;
  p.state = 'dead';
  bloodstain = { x: p.x, y: p.y, souls: p.souls, pulse: 0 };
  p.souls = 0;
  game.state = 'dead';
  game.deathTimer = 0;
  game.shake = 20;
  sfx.die();
}

function respawnPlayer() {
  const p = player;
  p.dead = false;
  p.hp = p.maxHp;
  p.stamina = p.maxStamina;
  p.flasks = p.maxFlasks;
  p.x = bonfire.x;
  p.y = bonfire.y - 90;
  p.state = 'idle';
  p.stateT = 0;
  p.invuln = 1.4;
  p.souls = 0;
  p.soul = 0;
  p.flash = 0;
  p.staminaDelay = 0;
  resetEnemies();
  game.state = 'playing';
  game.deathTimer = 0;
  game.camX = clamp(p.x - viewW() / 2, 0, Math.max(0, WORLD.w - viewW()));
  game.camY = clamp(p.y - viewH() / 2, 0, Math.max(0, WORLD.h - viewH()));
}

function restAtBonfire() {
  const p = player;
  p.hp = p.maxHp;
  p.stamina = p.maxStamina;
  p.staminaDelay = 0;
  p.flasks = p.maxFlasks;
  p.invuln = 0.6;
  resetEnemies();
  game.toast = { text: '篝火已点燃 · 敌人已重生', t: 2.4 };
  game.shake = 4;
  sfx.bonfire();
}

// ---------------- 更新：玩家 ----------------
function updatePlayer(dt) {
  const p = player;
  p.stateT += dt;
  p.invuln = Math.max(0, p.invuln - dt);
  p.flash = Math.max(0, p.flash - dt);
  p.staminaDelay = Math.max(0, p.staminaDelay - dt);

  if (p.dead) return;

  // 移动输入
  let ix = 0;
  let iy = 0;
  if (keys['a'] || keys['arrowleft'] || touch.joyX < -0.3) ix -= 1;
  if (keys['d'] || keys['arrowright'] || touch.joyX > 0.3) ix += 1;
  if (keys['w'] || keys['arrowup'] || touch.joyY < -0.3) iy -= 1;
  if (keys['s'] || keys['arrowdown'] || touch.joyY > 0.3) iy += 1;
  const il = Math.hypot(ix, iy);
  if (il > 0) {
    ix /= il;
    iy /= il;
  }

  // 冲刺与法术（在状态机之前拦输入）
  p.dashCd = Math.max(0, p.dashCd - dt);
  p.parryWin = Math.max(0, p.parryWin - dt);
  const canAct = p.state !== 'roll' && p.state !== 'attack' &&
                 p.state !== 'dash' && p.state !== 'cast' && p.state !== 'hurt' &&
                 p.state !== 'block';
  if (pressed['shift'] && canAct && p.dashCd <= 0 && p.stamina >= 14) {
    startDash(p, ix, iy);
  } else if (pressed['f'] && canAct && p.soul >= 33) {
    startCast(p);
  }

  // 原素瓶
  if (pressed['r'] && p.flasks > 0 && p.hp < p.maxHp &&
      p.state !== 'roll' && p.state !== 'attack' && p.state !== 'hurt') {
    p.flasks--;
    p.hp = Math.min(p.maxHp, p.hp + 45);
    addFloater(p.x, p.y - p.r - 10, '+45', '#ffb0a0');
    game.toast = { text: '饮用原素瓶', t: 1.2 };
    sfx.soul();
  }

  // 锁定切换
  if (pressed['tab']) toggleLock();

  // 连招窗口：出招结束后 0.62 秒内再按攻击可接下一段
  if (p.state !== 'attack' && p.comboT > 0) {
    p.comboT = Math.max(0, p.comboT - dt);
    if (p.comboT === 0) p.combo = 0;
  }

  // 耐力恢复
  if (p.staminaDelay <= 0 && p.state !== 'roll' && p.state !== 'attack' && p.state !== 'block') {
    p.stamina = Math.min(p.maxStamina, p.stamina + 32 * dt);
  }

  // 状态机
  if (p.state === 'idle' || p.state === 'walk') {
    if ((keys['l'] || keys['mouse2'] || keys['block']) && p.stamina > 8) {
      p.state = 'block';
      p.stateT = 0;
      p.parryWin = 0.2;   // 起手 0.2 秒内挡到 = 完美格挡
      sfx.block();
    } else if ((pressed['k'] || pressed[' ']) && p.stamina >= 25) {
      startRoll(p, ix, iy);
    } else if ((pressed['j'] || pressed['mouse']) && p.stamina >= 15) {
      startAttack(p);
    } else if (il > 0) {
      p.facing = Math.atan2(iy, ix);
      p.x += ix * p.speed * dt;
      p.y += iy * p.speed * dt;
      p.state = 'walk';
      p.walkPhase += dt * 10;
    } else {
      p.state = 'idle';
    }
  } else if (p.state === 'block') {
    const holding = keys['l'] || keys['mouse2'] || keys['block'];
    p.stamina -= 13 * dt;
    p.staminaDelay = 0.4;
    if (!holding) {
      p.state = 'idle';
      p.stateT = 0;
    } else if (p.stamina <= 0) {
      p.stamina = 0;
      p.state = 'idle';
      p.stateT = 0;
      game.toast = { text: '耐力耗尽 · 破防', t: 1.0 };
    } else {
      if (il > 0) {
        p.x += ix * p.speed * 0.5 * dt;
        p.y += iy * p.speed * 0.5 * dt;
        p.walkPhase += dt * 6;
        p.facing = angleLerp(p.facing, Math.atan2(iy, ix), Math.min(1, 9 * dt));
      } else if (lockTarget && !lockTarget.dead) {
        p.facing = angleLerp(p.facing, Math.atan2(lockTarget.y - p.y, lockTarget.x - p.x), Math.min(1, 9 * dt));
      }
      p.vx = 0;
      p.vy = 0;
      if ((pressed['k'] || pressed[' ']) && p.stamina >= 25) startRoll(p, ix, iy);
    }
  } else if (p.state === 'attack') {
    const c = COMBO[p.combo] || COMBO[0];
    const t = p.stateT;
    if (t >= c.hitAt && !p.attackHitDone) {
      p.attackHitDone = true;
      playerAttackHit();
    }
    if ((pressed['j'] || pressed['mouse']) && t >= c.hitAt) p.comboQueued = true;
    if ((pressed['k'] || pressed[' ']) && t > 0.1) {
      if (p.combo === 0 && p.stamina >= SPECIALS.dash.stamina && t >= c.hitAt) {
        startDashSlash(p);
      } else if (p.combo === 1 && p.stamina >= SPECIALS.spin.stamina && t >= c.hitAt) {
        startSpin(p);
      } else if (t > 0.18 && p.stamina >= 25) {
        startRoll(p, ix, iy);
      }
    } else if (p.comboQueued && p.combo < COMBO.length - 1 && t >= c.hitAt) {
      startAttack(p, true);
    } else if (t >= atkTotal(c)) {
      p.state = 'idle';
      p.stateT = 0;
      p.comboT = 0.62;
    }
  } else if (p.state === 'dashslash') {
    const t = p.stateT;
    if (t < 0.22) {
      p.x += p.dashDx * SPECIALS.dash.moveSpeed * dt;
      p.y += p.dashDy * SPECIALS.dash.moveSpeed * dt;
    }
    if (t >= 0.05 && !p.attackHitDone) {
      p.attackHitDone = true;
      playerSpecialHit('dash');
    }
    if (t >= SPECIALS.dash.dur) {
      p.state = 'idle';
      p.stateT = 0;
      p.comboT = 0.25;
    }
  } else if (p.state === 'spin') {
    const t = p.stateT;
    if (t >= 0.1 && !p.attackHitDone) {
      p.attackHitDone = true;
      playerSpecialHit('spin');
    }
    if (t >= 0.28 && !p.spinHit2) {
      p.spinHit2 = true;
      playerSpecialHit('spin');
    }
    if (t >= SPECIALS.spin.dur) {
      p.state = 'idle';
      p.stateT = 0;
      p.comboT = 0.2;
    }
  } else if (p.state === 'roll') {
    if (p.stateT < 0.34) {
      const sp = 470;
      p.x += p.rollDx * sp * dt;
      p.y += p.rollDy * sp * dt;
    }
    if (p.stateT >= 0.5) {
      p.state = 'idle';
      p.stateT = 0;
    }
  } else if (p.state === 'dash') {
    if (p.stateT < 0.17) {
      const sp = 720;
      p.x += p.dashDx * sp * dt;
      p.y += p.dashDy * sp * dt;
    }
    if (p.stateT >= 0.22) {
      p.state = 'idle';
      p.stateT = 0;
    }
  } else if (p.state === 'cast') {
    if (!p.castDone && p.stateT >= 0.1) {
      p.castDone = true;
      fireSpell(p);
    }
    if (p.stateT >= 0.32) {
      p.state = 'idle';
      p.stateT = 0;
    }
  } else if (p.state === 'hurt') {
    // 破防被打断时硬直更久
    if (p.staggerT > 0) {
      p.staggerT = Math.max(0, p.staggerT - dt);
      p.staminaDelay = 0.6;
    } else if (p.stateT >= 0.32) {
      p.state = 'idle';
      p.stateT = 0;
    }
  }

  // 锁定目标失效检查
  if (lockTarget && (lockTarget.dead || (lockTarget === boss && (!boss || !boss.aggro)))) {
    lockTarget = null;
  }

  resolveObstacles(p);

  // 篝火交互
  const bd = dist(p, bonfire);
  game.nearBonfire = bd < 82;
  const vd = Math.hypot(p.x - vendor.x, p.y - vendor.y);
  game.nearVendor = vd < 78;
  if (pressed['e']) {
    if (vd < 78) openShop();
    else if (game.nearBonfire) restAtBonfire();
  }
}

// ---------------- 商店 ----------------
function openShop() {
  game.state = 'shop';
  game.shopSel = 0;
  game.shopMsg = null;
  game.shopMsgT = 0;
  sfx.bonfire();
}

function closeShop() {
  game.state = 'playing';
  game.shopMsg = null;
  game.shopMsgT = 0;
}

function buyItem(it) {
  const p = player;
  if (it.owned) {
    game.shopMsg = '你已经有了';
    game.shopMsgT = 1.6;
    return;
  }
  if (p.souls < it.price) {
    game.shopMsg = '魂不够（还差 ' + (it.price - p.souls) + '）';
    game.shopMsgT = 1.6;
    return;
  }
  p.souls -= it.price;
  if (it.kind === 'weapon') {
    p.ownedWeapons.push(it.weapon);
    p.weapon = it.weapon;
    game.shopMsg = '装备了 ' + it.name;
  } else if (it.id === 'flask') {
    p.maxFlasks++;
    p.flasks = p.maxFlasks;
    game.shopMsg = '原素瓶 +1';
  } else if (it.id === 'heal') {
    p.hp = p.maxHp;
    game.shopMsg = '生命已回满';
  } else if (it.id === 'soul') {
    p.soulMax += 30;
    game.shopMsg = '灵魂上限 +30';
  } else if (it.id === 'stamina') {
    p.maxStamina += 15;
    p.stamina = p.maxStamina;
    game.shopMsg = '耐力上限 +15';
  }
  game.shopMsgT = 1.6;
  sfx.bonfire();
}

function updateShop(dt) {
  if (game.shopMsgT > 0) {
    game.shopMsgT -= dt;
    if (game.shopMsgT <= 0) game.shopMsg = null;
  }
  const list = shopList();
  if (pressed['w'] || pressed['arrowup']) game.shopSel = (game.shopSel + list.length - 1) % list.length;
  if (pressed['s'] || pressed['arrowdown']) game.shopSel = (game.shopSel + 1) % list.length;
  if (pressed['escape'] || pressed['e']) closeShop();
  if (pressed['j'] || pressed['enter']) {
    const it = list[game.shopSel];
    if (it) buyItem(it);
  }
}

// ---------------- 更新：普通敌人 ----------------
function updateEnemies(dt) {
  for (const e of enemies) {
    if (e.dead) continue;
    e.stateT += dt;
    e.flash = Math.max(0, e.flash - dt);
    if (e.guardT > 0) e.guardT = Math.max(0, e.guardT - dt);
    if (e.shotTimer > 0) e.shotTimer -= dt;
    const d = dist(e, player);
    const ang = Math.atan2(player.y - e.y, player.x - e.x);

    if (e.state === 'stagger') {
      if (e.stateT > 0.32) {
        e.state = 'chase';
        e.stateT = 0;
      }
      resolveObstacles(e);
      continue;
    }

    // 未激活：在出生点附近游荡
    if (!e.aggro) {
      e.wanderT -= dt;
      if (e.wanderT <= 0) {
        e.wanderT = rand(1.4, 3.2);
        e.wanderDir = rand(0, TAU);
      }
      const homeD = Math.hypot(e.x - e.homeX, e.y - e.homeY);
      if (homeD > 190) e.wanderDir = Math.atan2(e.homeY - e.y, e.homeX - e.x);
      e.facing = e.wanderDir;
      e.x += Math.cos(e.wanderDir) * 26 * dt;
      e.y += Math.sin(e.wanderDir) * 26 * dt;
      if (d < 340 && !player.dead) {
        e.aggro = true;
        e.state = 'chase';
        e.stateT = 0;
      }
      resolveObstacles(e);
      continue;
    }

    if (player.dead) {
      e.state = 'idle';
      e.aggro = false;
      e.stateT = 0;
      resolveObstacles(e);
      continue;
    }

    if (e.state === 'idle') {
      e.state = 'chase';
      e.stateT = 0;
    } else if (e.state === 'chase') {
      // 盾兵转身慢，给玩家绕后的机会
      e.facing = e.shield ? angleLerp(e.facing, ang, Math.min(1, 2.2 * dt)) : ang;
      if (e.ranged) {
        // 远程：维持距离，够近就搭箭
        if (d > e.keepDist + 40) {
          e.x += Math.cos(ang) * e.speed * dt;
          e.y += Math.sin(ang) * e.speed * dt;
        } else if (d < e.keepDist - 40) {
          e.x -= Math.cos(ang) * e.speed * dt;
          e.y -= Math.sin(ang) * e.speed * dt;
        }
        if (d < e.atkRange && e.shotTimer <= 0) {
          e.state = 'windup';
          e.stateT = 0;
          e.hitDone = false;
        }
      } else {
        if (d > e.atkRange) {
          e.x += Math.cos(ang) * e.speed * dt;
          e.y += Math.sin(ang) * e.speed * dt;
        }
        if (d <= e.atkRange + 6) {
          e.state = 'windup';
          e.stateT = 0;
          e.hitDone = false;
        }
      }
    } else if (e.state === 'windup') {
      e.facing = angleLerp(e.facing, ang, Math.min(1, 3 * dt));
      if (e.stateT >= e.windup) {
        e.state = 'active';
        e.stateT = 0;
        e.hitDone = false;
        if (e.ranged) {
          fireEnemyShot(e);
        } else {
          addEffect(makeSlashEffect(
            e.x + Math.cos(e.facing) * 40,
            e.y + Math.sin(e.facing) * 40,
            e.facing, '#ff9a6a'
          ));
        }
      }
    } else if (e.state === 'active') {
      if (!e.hitDone && !e.ranged) {
        e.hitDone = true;
        if (d < e.atkRange + 20 && Math.abs(angleDiff(ang, e.facing)) < 1.0) {
          const r = damagePlayer(e.dmg, e.x, e.y);
          if (r === 'parry') {
            // 完美格挡把敌人打硬直
            e.state = 'stagger';
            e.stateT = 0;
            e.hitDone = true;
          }
        }
        // 这一下挥砍也会误伤身边的其他敌人
        for (const o of enemies) {
          if (o === e || o.dead) continue;
          if (Math.hypot(o.x - e.x, o.y - e.y) > e.atkRange + o.r + 6) continue;
          const oa = Math.atan2(o.y - e.y, o.x - e.x);
          if (Math.abs(angleDiff(oa, e.facing)) < 1.1) {
            damageEnemy(o, Math.max(1, Math.round(e.dmg * 0.6)), oa, false);
          }
        }
      }
      if (e.stateT >= e.active) {
        e.state = 'recover';
        e.stateT = 0;
      }
    } else if (e.state === 'recover') {
      if (e.stateT >= e.recover) {
        e.state = 'chase';
        e.stateT = 0;
        if (e.ranged) e.shotTimer = e.shotCd;
      }
    }

    resolveObstacles(e);
  }
  pushApart(enemies);
}

// ---------------- 更新：Boss ----------------
function updateBoss(dt) {
  const b = boss;
  if (!b || b.dead) return;
  b.stateT += dt;
  b.flash = Math.max(0, b.flash - dt);
  const d = dist(b, player);
  const ang = Math.atan2(player.y - b.y, player.x - b.x);

  if (b.state === 'dormant') {
    if (d < 620 && !player.dead) {
      b.aggro = true;
      b.state = 'chase';
      b.stateT = 0;
      game.toast = { text: '守墓者 苏醒', t: 2.4 };
      game.shake = 10;
      sfx.bossRoar();
    } else {
      b.facing = ang;
    }
    return;
  }

  if (b.state === 'stagger') {
    if (b.stateT > 0.4) {
      b.state = 'chase';
      b.stateT = 0;
    }
    return;
  }

  if (player.dead) {
    b.state = 'chase';
    b.stateT = 0;
    return;
  }

  // 第二阶段
  if (b.phase === 1 && b.hp < b.maxHp * 0.5) {
    b.phase = 2;
    b.speed = 88;
    b.dmg = 34;
    game.toast = { text: '灰烬燃烧 · 第二阶段', t: 2 };
    game.shake = 12;
    sfx.bossRoar();
    addEffect(makeShockwave(b.x, b.y, '#ff7a3a'));
  }

  switch (b.state) {
    case 'chase': {
      b.facing = ang;
      if (d > 170) {
        b.x += Math.cos(ang) * b.speed * dt;
        b.y += Math.sin(ang) * b.speed * dt;
      }
      if (d < 215 && b.stateT > 0.25) {
        b.stateT = 0;
        b.attackChooser = (b.attackChooser + 1) % 2;
        if (b.phase === 2) b.attackChooser = Math.random() < 0.35 ? 1 : 0;
        if (b.attackChooser === 0) {
          b.state = 'sweepWind';
          b.stateT = 0;
          b.hitDone = false;
        } else {
          b.state = 'slamWind';
          b.stateT = 0;
          b.hitDone = false;
        }
      }
      break;
    }
    case 'sweepWind': {
      b.facing = angleLerp(b.facing, ang, Math.min(1, 2 * dt));
      if (b.stateT >= 0.7) {
        b.state = 'sweepActive';
        b.stateT = 0;
        b.hitDone = false;
        addEffect(makeSlashEffect(
          b.x + Math.cos(b.facing) * 95,
          b.y + Math.sin(b.facing) * 95,
          b.facing, '#ff8a4a', 1.5
        ));
        game.shake = Math.max(game.shake, 9);
      }
      break;
    }
    case 'sweepActive': {
      if (!b.hitDone) {
        b.hitDone = true;
        if (d < 205 && Math.abs(angleDiff(ang, b.facing)) < 1.1) {
          const r = damagePlayer(b.dmg, b.x, b.y);
          if (r === 'parry') {
            b.state = 'stagger';
            b.stateT = 0;
          }
        }
      }
      if (b.stateT >= 0.16) {
        b.state = 'recover';
        b.stateT = 0;
      }
      break;
    }
    case 'slamWind': {
      b.facing = angleLerp(b.facing, ang, Math.min(1, 4 * dt));
      if (b.stateT >= 0.55) {
        b.jumpFromX = b.x;
        b.jumpFromY = b.y;
        b.jumpToX = player.x;
        b.jumpToY = player.y;
        b.state = 'slamAir';
        b.stateT = 0;
      }
      break;
    }
    case 'slamAir': {
      const t = clamp(b.stateT / 0.34, 0, 1);
      b.x = lerp(b.jumpFromX, b.jumpToX, t);
      b.y = lerp(b.jumpFromY, b.jumpToY, t);
      if (b.stateT >= 0.34) {
        b.state = 'recover';
        b.stateT = 0;
        game.shake = Math.max(game.shake, 16);
        game.hitStop = 0.04;
        addEffect(makeShockwave(b.x, b.y, '#ffb06a'));
        sfx.hit();
        if (Math.hypot(player.x - b.x, player.y - b.y) < 155) {
          const r = damagePlayer(b.phase === 2 ? 40 : 36, b.x, b.y);
          if (r === 'parry') {
            b.state = 'stagger';
            b.stateT = 0;
          }
        }
      }
      break;
    }
    case 'recover': {
      if (b.stateT >= (b.phase === 2 ? 0.7 : 1.0)) {
        b.state = 'chase';
        b.stateT = 0;
      }
      break;
    }
    default: {
      b.state = 'chase';
      b.stateT = 0;
    }
  }

  // 推开玩家
  const dx = player.x - b.x;
  const dy = player.y - b.y;
  const dd = Math.hypot(dx, dy);
  if (dd > 0.001 && dd < b.r + player.r) {
    const push = b.r + player.r - dd;
    player.x += dx / dd * push;
    player.y += dy / dd * push;
  }

  resolveObstacles(b);
}

// ---------------- 更新：血痕 ----------------
function updateBloodstain(dt) {
  if (!bloodstain) return;
  bloodstain.pulse = (bloodstain.pulse || 0) + dt;
  if (!player.dead && dist(player, bloodstain) < 48) {
    player.souls += bloodstain.souls;
    addFloater(bloodstain.x, bloodstain.y - 26, '+' + bloodstain.souls, '#9be7ff');
    sfx.soul();
    bloodstain = null;
  }
}

// ---------------- 相机 ----------------
function updateCamera(dt) {
  const vw = viewW();
  const vh = viewH();
  const targetX = vw >= WORLD.w
    ? (WORLD.w - vw) / 2
    : clamp(player.x - vw / 2, 0, WORLD.w - vw);
  const targetY = vh >= WORLD.h
    ? (WORLD.h - vh) / 2
    : clamp(player.y - vh / 2, 0, WORLD.h - vh);
  const k = 1 - Math.exp(-10 * dt);
  game.camX = lerp(game.camX, targetX, k);
  game.camY = lerp(game.camY, targetY, k);
}

// ---------------- 主更新 ----------------
function update(dt) {
  game.time += dt;
  zoom = lerp(zoom, zoomTarget, Math.min(1, dt * 9));
  if (pressed['zoomin']) bumpZoom(1.12);
  if (pressed['zoomout']) bumpZoom(1 / 1.12);
  game.shake = Math.max(0, game.shake - dt * 45);
  if (game.toast) {
    game.toast.t -= dt;
    if (game.toast.t <= 0) game.toast = null;
  }

  if (game.state === 'dead') {
    game.deathTimer += dt;
    if (game.deathTimer > 2.8) respawnPlayer();
    updateEffects(dt);
    updateFloaters(dt);
    updateCamera(dt);
    return;
  }

  if (game.state === 'shop') {
    updateShop(dt);
    updateEffects(dt);
    updateFloaters(dt);
    updateCamera(dt);
    return;
  }

  if (game.state === 'victory') {
    game.victoryTimer += dt;
    if (game.victoryTimer > 5.5) game.state = 'playing';
  }

  updatePlayer(dt);
  updateEnemies(dt);
  updateBoss(dt);
  updateProjectiles(dt);
  updateEProjectiles(dt);
  updateBloodstain(dt);
  updateEffects(dt);
  updateFloaters(dt);
  updateCamera(dt);
}

// ---------------- 初始化世界 ----------------
function resetAll() {
  player = makePlayer();
  bossDefeated = false;
  resetEnemies();
  bloodstain = null;
  lockTarget = null;
  game.state = 'playing';
  game.deathTimer = 0;
  game.victoryTimer = 0;
  game.shake = 0;
  game.hitStop = 0;
  game.toast = null;
  game.nearBonfire = false;
  game.nearVendor = false;
  game.shopSel = 0;
  game.shopMsg = null;
  game.shopMsgT = 0;
  game.camX = clamp(player.x - viewW() / 2, 0, Math.max(0, WORLD.w - viewW()));
  game.camY = clamp(player.y - viewH() / 2, 0, Math.max(0, WORLD.h - viewH()));
  floaters = [];
  effects = [];
  projectiles = [];
  eProjectiles = [];
}

// ================= 像素渲染管线（泰拉瑞亚式观感） =================
const PIXEL = 3;
let lowCanvas = null;
let lowCtx = null;
let lowW = 0;
let lowH = 0;
let G = ctx;

// 视野的世界尺寸（缩放后）
function viewW() { return (lowW || Math.ceil(W / PIXEL)) / zoom; }
function viewH() { return (lowH || Math.ceil(H / PIXEL)) / zoom; }

function initLow() {
  lowW = Math.ceil(W / PIXEL);
  lowH = Math.ceil(H / PIXEL);
  if (!lowCanvas) lowCanvas = document.createElement('canvas');
  lowCanvas.width = lowW;
  lowCanvas.height = lowH;
  lowCtx = lowCanvas.getContext('2d');
  lowCtx.imageSmoothingEnabled = false;
}

function mulberry32(a) {
  return function () {
    a |= 0;
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function px(x, y, w, h, col) {
  G.fillStyle = col;
  G.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

// ---------------- 地面纹理 ----------------
let groundPattern = null;

function makeGroundTexture() {
  const S = 128;
  const c = document.createElement('canvas');
  c.width = S;
  c.height = S;
  const g = c.getContext('2d');
  const rnd = mulberry32(20261027);

  // 基色 + 逐像素亮度噪声（无硬边色块）
  const baseR = 68, baseG = 84, baseB = 52;
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const n = (rnd() - 0.5) * 16;
      const m = (rnd() - 0.5) * 6;
      const r = Math.max(0, Math.min(255, Math.round(baseR + n + m)));
      const gg = Math.max(0, Math.min(255, Math.round(baseG + n)));
      const b = Math.max(0, Math.min(255, Math.round(baseB + n * 0.7 - m)));
      g.fillStyle = 'rgb(' + r + ',' + gg + ',' + b + ')';
      g.fillRect(x, y, 1, 1);
    }
  }

  // 低频柔和暗斑 / 亮斑
  for (let i = 0; i < 22; i++) {
    const cx = rnd() * S, cy = rnd() * S, rad = 10 + rnd() * 26;
    const grd = g.createRadialGradient(cx, cy, 0, cx, cy, rad);
    const dark = rnd() < 0.6;
    grd.addColorStop(0, dark ? 'rgba(20,26,14,0.18)' : 'rgba(150,170,110,0.10)');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd;
    g.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
  }

  // 草叶
  for (let i = 0; i < 210; i++) {
    const bx = Math.floor(rnd() * S);
    const by = Math.floor(rnd() * S);
    const bh = 2 + Math.floor(rnd() * 4);
    g.fillStyle = rnd() < 0.55 ? 'rgba(88,110,62,0.55)' : 'rgba(64,86,46,0.5)';
    g.fillRect(bx, by, 1, bh);
  }
  // 石子
  for (let i = 0; i < 26; i++) {
    g.fillStyle = rnd() < 0.5 ? '#4d4a42' : '#3a382f';
    g.fillRect(Math.floor(rnd() * S), Math.floor(rnd() * S), 2, 2);
  }
  // 枯叶
  for (let i = 0; i < 14; i++) {
    g.fillStyle = rnd() < 0.5 ? '#5b4a2b' : '#6a5730';
    g.fillRect(Math.floor(rnd() * S), Math.floor(rnd() * S), 3, 2);
  }
  return c;
}

// ---------------- 地表装饰 ----------------
const decor = [];
const ashParticles = [];

function buildDecor() {
  decor.length = 0;
  const rnd = mulberry32(77711);
  const farFromBonfire = (x, y, d) => Math.hypot(x - bonfire.x, y - bonfire.y) > d;
  const clearOfPillars = (x, y, d) => {
    for (const o of obstacles) if (Math.hypot(x - o.x, y - o.y) < o.r + d) return false;
    return true;
  };

  for (let i = 0; i < 300; i++) {
    const x = 30 + rnd() * (WORLD.w - 60);
    const y = 30 + rnd() * (WORLD.h - 60);
    if (!farFromBonfire(x, y, 90)) continue;
    decor.push({ type: 'grass', x: x, y: y, s: 0.7 + rnd() * 0.95, seed: rnd() });
  }
  for (let i = 0; i < 80; i++) {
    const x = 40 + rnd() * (WORLD.w - 80);
    const y = 40 + rnd() * (WORLD.h - 80);
    if (!clearOfPillars(x, y, 26)) continue;
    decor.push({ type: 'rock', x: x, y: y, s: 0.6 + rnd() * 0.9, seed: rnd() });
  }
  for (let i = 0; i < 46; i++) {
    const x = 60 + rnd() * (WORLD.w - 120);
    const y = 60 + rnd() * (WORLD.h - 120);
    if (!clearOfPillars(x, y, 20)) continue;
    decor.push({ type: 'shroom', x: x, y: y, s: 0.75 + rnd() * 0.6, seed: rnd() });
  }
  for (let i = 0; i < 18; i++) {
    const x = 120 + rnd() * (WORLD.w - 240);
    const y = 120 + rnd() * (WORLD.h - 240);
    if (!clearOfPillars(x, y, 90) || !farFromBonfire(x, y, 160)) continue;
    decor.push({ type: 'tree', x: x, y: y, s: 0.9 + rnd() * 0.7, seed: rnd() });
  }
  for (let i = 0; i < 16; i++) {
    const x = 140 + rnd() * (WORLD.w - 280);
    const y = 140 + rnd() * (WORLD.h - 280);
    if (!clearOfPillars(x, y, 60)) continue;
    decor.push({ type: 'grave', x: x, y: y, s: 0.95 + rnd() * 0.4, seed: rnd() });
  }
  for (let i = 0; i < 14; i++) {
    const x = 80 + rnd() * (WORLD.w - 160);
    const y = 80 + rnd() * (WORLD.h - 160);
    if (!clearOfPillars(x, y, 40)) continue;
    decor.push({ type: 'bones', x: x, y: y, s: 0.9 + rnd() * 0.5, seed: rnd() });
  }
  decor.sort((a, b) => a.y - b.y);

  ashParticles.length = 0;
  const r2 = mulberry32(3131);
  for (let i = 0; i < 52; i++) {
    ashParticles.push({
      x: r2(), y: r2(),
      s: 0.35 + r2() * 0.9,
      ph: r2() * TAU,
      len: 0.4 + r2() * 0.8
    });
  }
}

function initGraphics() {
  groundPattern = ctx.createPattern(makeGroundTexture(), 'repeat');
  buildDecor();
}

// ---------------- 渲染：背景与世界 ----------------
function drawBackdrop() {
  G.fillStyle = '#14170f';
  G.fillRect(0, 0, lowW, lowH);
  // 远处雾带（屏幕层）
  const g = G.createLinearGradient(0, 0, 0, lowH);
  g.addColorStop(0, 'rgba(32,38,46,0.28)');
  g.addColorStop(0.45, 'rgba(16,19,15,0.06)');
  g.addColorStop(1, 'rgba(10,11,9,0.32)');
  G.fillStyle = g;
  G.fillRect(0, 0, lowW, lowH);
}

function drawFloor() {
  const cx = game.camX;
  const cy = game.camY;
  G.fillStyle = '#080907';
  G.fillRect(cx - 220, cy - 220, W + 440, H + 440);

  G.save();
  G.beginPath();
  G.rect(0, 0, WORLD.w, WORLD.h);
  G.clip();

  G.fillStyle = groundPattern;
  G.fillRect(0, 0, WORLD.w, WORLD.h);

  // 大块暗斑打破平铺感
  const rnd = mulberry32(4242);
  for (let i = 0; i < 110; i++) {
    const x = rnd() * WORLD.w;
    const y = rnd() * WORLD.h;
    const r = 40 + rnd() * 150;
    G.fillStyle = 'rgba(8,10,7,' + (0.06 + rnd() * 0.10).toFixed(3) + ')';
    G.beginPath();
    G.arc(x, y, r, 0, TAU);
    G.fill();
  }

  // 世界边缘渐暗
  const edge = G.createRadialGradient(
    WORLD.w / 2, WORLD.h / 2, 620,
    WORLD.w / 2, WORLD.h / 2, 1750
  );
  edge.addColorStop(0, 'rgba(0,0,0,0)');
  edge.addColorStop(1, 'rgba(0,0,0,0.52)');
  G.fillStyle = edge;
  G.fillRect(0, 0, WORLD.w, WORLD.h);
  G.restore();

  // 边界石带
  G.strokeStyle = 'rgba(90,100,80,0.10)';
  G.lineWidth = 6;
  G.strokeRect(2, 2, WORLD.w - 4, WORLD.h - 4);
}

function visible(x, y, pad) {
  pad = pad || 120;
  return x > game.camX - pad && x < game.camX + viewW() + pad &&
         y > game.camY - pad * 1.6 && y < game.camY + viewH() + pad;
}

function drawShadow(x, y, r) {
  G.save();
  G.globalAlpha = 0.5;
  G.fillStyle = '#000';
  G.beginPath();
  G.ellipse(x, y, r * 0.95, r * 0.4, 0, 0, TAU);
  G.fill();
  G.restore();
}

function drawTree(d) {
  const s = d.s * 1.45;
  const sway = Math.sin(game.time * 1.2 + d.seed * 9) * 1.5;
  // 影子
  G.fillStyle = 'rgba(0,0,0,0.32)';
  G.beginPath();
  G.ellipse(d.x + 6, d.y + 4, 26 * s, 9 * s, 0, 0, TAU);
  G.fill();
  // 树干
  px(d.x - 3 * s, d.y - 34 * s, 6 * s, 36 * s, '#3a2a1c');
  px(d.x - 3 * s, d.y - 34 * s, 2 * s, 36 * s, '#4c3826');
  // 树枝
  px(d.x - 12 * s + sway, d.y - 40 * s, 10 * s, 3 * s, '#3a2a1c');
  px(d.x + 3 * s - sway, d.y - 48 * s, 11 * s, 3 * s, '#3a2a1c');
  // 树冠像素团
  const cx = d.x + sway;
  const cy = d.y - 48 * s;
  const blobs = [
    [0, 0, 15], [-11, 4, 10], [11, 3, 10], [-6, -10, 10], [7, -11, 9], [0, 10, 11]
  ];
  for (const b of blobs) {
    px(cx + b[0] * s - b[2] * s * 0.5, cy + b[1] * s - b[2] * s * 0.5, b[2] * s, b[2] * s * 0.9, '#25402e');
  }
  for (const b of blobs) {
    px(cx + b[0] * s - b[2] * s * 0.42, cy + b[1] * s - b[2] * s * 0.62, b[2] * s * 0.8, b[2] * s * 0.42, '#35583a');
  }
  for (const b of blobs) {
    px(cx + b[0] * s - b[2] * s * 0.28, cy + b[1] * s - b[2] * s * 0.72, b[2] * s * 0.5, b[2] * s * 0.2, '#47713f');
  }
}

function drawDecorItem(d) {
  switch (d.type) {
    case 'grass': {
      const sway = Math.sin(game.time * 1.8 + d.seed * 8) * 1.3;
      const col = d.seed > 0.55 ? '#4c5f33' : (d.seed > 0.25 ? '#40522c' : '#37471f');
      for (let i = 0; i < 3; i++) {
        const ox = (i - 1) * 3 * d.s;
        px(d.x + ox + sway, d.y - (5 + i * 2) * d.s, 1, (5 + i * 2) * d.s, col);
      }
      break;
    }
    case 'rock': {
      const w = 9 * d.s;
      const h = 7 * d.s;
      G.fillStyle = 'rgba(0,0,0,0.3)';
      G.beginPath();
      G.ellipse(d.x + 1, d.y + 2, w * 0.9, h * 0.4, 0, 0, TAU);
      G.fill();
      px(d.x - w / 2, d.y - h, w, h, '#4a4740');
      px(d.x - w / 2, d.y - h, w, 2, '#5c584e');
      px(d.x - w / 2 + 1, d.y - h + 3, w * 0.4, 2, '#3a3833');
      if (d.seed > 0.6) px(d.x - 1, d.y - h + 1, 2, 2, '#5f6b45');
      break;
    }
    case 'shroom': {
      const w = 6 * d.s;
      px(d.x - 0.5, d.y - 6 * d.s, 2, 6 * d.s, '#8a8272');
      px(d.x - w / 2, d.y - 8 * d.s, w, 3 * d.s, d.seed > 0.5 ? '#a8452f' : '#7a3f6a');
      px(d.x - w / 2 + 1, d.y - 8 * d.s, w - 2, 1, '#d0715a');
      break;
    }
    case 'grave': {
      const w = 14 * d.s;
      const h = 20 * d.s;
      G.fillStyle = 'rgba(0,0,0,0.35)';
      G.beginPath();
      G.ellipse(d.x, d.y, w * 0.8, 4, 0, 0, TAU);
      G.fill();
      px(d.x - w / 2, d.y - h, w, h, '#55524b');
      px(d.x - w / 2, d.y - h, w, 2, '#6b675e');
      px(d.x - w / 2 + 2, d.y - h + 4, w - 4, 1, '#3a3833');
      px(d.x - 1, d.y - h + 7, 2, 8, '#3a3833');
      px(d.x - 4, d.y - h + 10, 8, 2, '#3a3833');
      if (d.seed > 0.5) px(d.x + 2, d.y - 4, 3, 4, '#2f3a26');
      break;
    }
    case 'bones': {
      px(d.x - 5, d.y - 3, 10, 2, '#b9b2a0');
      px(d.x - 4, d.y - 1, 8, 1, '#8e8878');
      px(d.x - 1, d.y - 6, 3, 3, '#c6bfae');
      px(d.x + 4, d.y - 5, 2, 5, '#a9a292');
      break;
    }
    default: break;
  }
}

function drawGroundDecor() {
  for (const d of decor) {
    if (!visible(d.x, d.y)) continue;
    if (d.type === 'tree') drawTree(d);
    else drawDecorItem(d);
  }
}

function drawObstacles() {
  for (const o of obstacles) {
    if (!visible(o.x, o.y, 160)) continue;
    drawShadow(o.x, o.y + o.r * 0.5, o.r * 1.05);
    // 石柱主体
    const w = o.r * 1.5;
    const h = o.r * 2.1;
    px(o.x - w / 2, o.y - h * 0.72, w, h, '#3c3a33');
    px(o.x - w / 2, o.y - h * 0.72, w * 0.42, h, '#4a4740');
    px(o.x - w / 2, o.y - h * 0.72, w, 3, '#5a564c');
    // 顶部盖石
    px(o.x - w / 2 - 3, o.y - h * 0.78, w + 6, 6, '#4f4c43');
    // 裂纹
    px(o.x + w * 0.12, o.y - h * 0.5, 2, h * 0.34, '#2b2a25');
    px(o.x - w * 0.28, o.y - h * 0.36, 6, 2, '#2b2a25');
    // 苔藓
    px(o.x - w / 2 + 2, o.y - h * 0.2, 4, 7, '#3a4a2c');
    px(o.x + w / 2 - 6, o.y - h * 0.34, 3, 5, '#33422a');
    // 底部碎石
    px(o.x - w * 0.75, o.y + 2, 7, 4, '#34322c');
    px(o.x + w * 0.35, o.y + 4, 6, 3, '#34322c');
  }
}

function drawBonfire() {
  const b = bonfire;
  const t = game.time;
  // 光晕
  const g = G.createRadialGradient(b.x, b.y - 10, 6, b.x, b.y - 10, 160);
  g.addColorStop(0, 'rgba(255,150,60,0.26)');
  g.addColorStop(0.45, 'rgba(255,120,40,0.09)');
  g.addColorStop(1, 'rgba(255,120,40,0)');
  G.fillStyle = g;
  G.beginPath();
  G.arc(b.x, b.y - 10, 160, 0, TAU);
  G.fill();

  // 石圈
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * TAU;
    px(b.x + Math.cos(a) * 27 - 4, b.y + Math.sin(a) * 12 + 4, 8, 5, i % 2 ? '#3d3a33' : '#4a463c');
  }
  // 木柴
  px(b.x - 15, b.y + 1, 30, 4, '#4a3524');
  px(b.x - 11, b.y - 3, 24, 4, '#573d29');
  // 火苗（像素块跳动）
  const flick = Math.sin(t * 9) * 2;
  const flames = [
    [0, 0, 10, 16, '#ff7a2e'],
    [-2, 1, 6, 12, '#ffa63c'],
    [2, 2, 5, 10, '#ff8c30'],
    [0, 4, 5, 10, '#ffd47a'],
    [-1, 7, 3, 6, '#fff0c0']
  ];
  for (const f of flames) {
    const fh = f[3] + flick * (f[3] / 16);
    px(b.x + f[0] - f[2] / 2, b.y - 10 - fh + f[1], f[2], fh, f[4]);
  }
  // 火星
  for (let i = 0; i < 6; i++) {
    const a = t * 1.4 + i * 1.9;
    const fx = b.x + Math.sin(a) * 16;
    const fy = b.y - 26 - ((t * 30 + i * 42) % 90);
    G.globalAlpha = 0.7 - ((t * 30 + i * 42) % 90) / 120;
    px(fx, fy, 2, 2, '#ffc46a');
    G.globalAlpha = 1;
  }
}

function drawBloodstain() {
  if (!bloodstain) return;
  const b = bloodstain;
  const t = game.time;
  const pulse = 0.55 + Math.sin(t * 4) * 0.3;
  const g = G.createRadialGradient(b.x, b.y - 8, 2, b.x, b.y - 8, 70);
  g.addColorStop(0, 'rgba(120,220,255,' + (0.40 * pulse).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(120,220,255,0)');
  G.fillStyle = g;
  G.beginPath();
  G.arc(b.x, b.y - 8, 70, 0, TAU);
  G.fill();
  const bob = Math.sin(t * 3) * 3;
  px(b.x - 5, b.y - 14 + bob, 10, 10, 'rgba(160,235,255,0.55)');
  px(b.x - 3, b.y - 16 + bob, 6, 6, 'rgba(220,250,255,0.9)');
