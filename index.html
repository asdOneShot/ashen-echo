'use strict';

// ============================================================
//  灰烬回响 · Ashen Echo
//  单文件魂类小游戏（Canvas 2D，零依赖）

// ---------------- 数学工具 ----------------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function angleDiff(a, b) {
  let d = (a - b) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}
function angleLerp(a, b, t) {
  return a + angleDiff(b, a) * t;
}

// ---------------- 画布 ----------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
const DPR = Math.min(2, window.devicePixelRatio || 1);
const touch = { joyId: null, joyX: 0, joyY: 0, joyCX: 0, joyCY: 0, active: false };
const TOUCH_BTNS = [];
const MOBILE_PRESETS = [
  { id: 'right', name: '右手主控', desc: '摇杆在左，技能键在右下' },
  { id: 'left', name: '左手主控', desc: '摇杆在右，技能键在左下' },
  { id: 'compact', name: '紧凑', desc: '按钮缩小、贴近边缘' },
];
let mobileLayout = 'right';
try { mobileLayout = localStorage.getItem('ashen_layout') || 'right'; } catch (e) {}

// ---------------- 视野缩放 ----------------
let zoom = 1.15;        // 当前缩放（1.15 = 默认视野，比 1.0 略近）
let zoomTarget = 1.15;  // 目标缩放，平滑趋近
const ZOOM_MIN = 0.65;
const ZOOM_MAX = 1.9;
const ZOOM_DEFAULT = 1.15;
function bumpZoom(f) {
  zoomTarget = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoomTarget * f));
}

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

}
resize();
window.addEventListener('resize', resize);

// ---------------- 输入 ----------------
const keys = Object.create(null);
const pressed = Object.create(null);

// ---------------- 按键绑定 ----------------
const ACTIONS = [
  { id: 'attack', name: '攻击 / 射击', alias: 'j' },
  { id: 'roll', name: '翻滚', alias: 'k' },
  { id: 'dash', name: '冲刺', alias: 'shift' },
  { id: 'block', name: '举盾格挡', alias: 'l' },
  { id: 'spell', name: '复仇之魂', alias: 'f' },
  { id: 'flask', name: '饮原素瓶', alias: 'r' },
  { id: 'interact', name: '交互 / 长椅', alias: 'e' },
  { id: 'lock', name: '锁定目标', alias: 'tab' },
  { id: 'cycle', name: '切换武器', alias: 'q' },
];
const DEFAULT_BINDS = { attack: 'j', roll: 'k', dash: 'shift', block: 'l', spell: 'f', flask: 'r', interact: 'e', lock: 'tab', cycle: 'q' };
let BINDS = Object.assign({}, DEFAULT_BINDS);
try {
  const rawB = localStorage.getItem('ashen_binds');
  if (rawB) BINDS = Object.assign({}, DEFAULT_BINDS, JSON.parse(rawB));
} catch (e) {}
function saveBinds() {
  try { localStorage.setItem('ashen_binds', JSON.stringify(BINDS)); } catch (e) {}
}
const KEY_LABEL = { ' ': '空格', shift: 'Shift', tab: 'Tab', escape: 'Esc', control: 'Ctrl', alt: 'Alt', arrowup: '↑', arrowdown: '↓', arrowleft: '←', arrowright: '→' };
function keyLabel(k) { return KEY_LABEL[k] || (k.length === 1 ? k.toUpperCase() : k); }
function actionOfKey(k) {
  for (const a of ACTIONS) if (BINDS[a.id] === k) return a;
  return null;
}
function bindKey(id, k) {
  const owner = actionOfKey(k);
  if (owner && owner.id !== id) {
    const tmp = BINDS[id];
    BINDS[id] = k;
    BINDS[owner.id] = tmp;
  } else {
    BINDS[id] = k;
  }
  saveBinds();
}

window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  initAudio();
  if (k === ' ' || k === 'tab' || k.startsWith('arrow')) e.preventDefault();
  // 设置面板：等待新按键
  if (game.settings) {
    if (game.settings.waiting) {
      e.preventDefault();
      if (k === 'escape') { game.settings.waiting = null; return; }
      bindKey(game.settings.waiting, k);
      game.settings.waiting = null;
      game.settings.msg = '已改为 ' + keyLabel(k);
      return;
    }
    if (k === 'escape') { closeSettings(); return; }
    if (!keys[k]) pressed[k] = true;
    keys[k] = true;
    return;
  }
  if (k === 'escape' && game.state !== 'shop') { openSettings(); return; }
  // 自定义键 → 原始逻辑键
  const act = actionOfKey(k);
  if (act) {
    if (!keys[act.alias]) pressed[act.alias] = true;
    keys[act.alias] = true;
  }
  if (!keys[k]) pressed[k] = true;
  keys[k] = true;
  if (k === '=' || k === '+' || k === ']') bumpZoom(1.12);
  if (k === '-' || k === '_' || k === '[') bumpZoom(1 / 1.12);
  if (k === '0') zoomTarget = ZOOM_DEFAULT;
});
window.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  keys[k] = false;
  const act = actionOfKey(k);
  if (act) keys[act.alias] = false;
});
window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
});

      const st = game.settings;

          st.sel = h.i;
          if (h.i < ACTIONS.length) st.waiting = ACTIONS[h.i].id;
          else if (h.i === ACTIONS.length) resetBinds();
          else if (h.i === ACTIONS.length + 1) {
            const di = DIFF_ORDER.indexOf(diffKey);
            diffKey = DIFF_ORDER[(di + 1) % DIFF_ORDER.length];
            resetEnemies();

            st.msg = '难度：' + D().name + '（' + D().tag + '）· 敌人已按新数值重生';
            st.msgT = 3;
          } else if (h.i === ACTIONS.length + 2) cycleLayout();
          else closeSettings();
          return;
        }
      }
      return;
    }
    pressed['mouse'] = true;
  }
  if (e.button === 2) keys['mouse2'] = true;
});

});

// ---------------- 触屏（手机虚拟摇杆 + 按键） ----------------
function layoutTouchButtons() {
  TOUCH_BTNS.length = 0;
  const compact = mobileLayout === 'compact';
  const lefty = mobileLayout === 'left';
  const R = Math.max(compact ? 24 : 28, Math.min(W, H) * (compact ? 0.052 : 0.062));
  const sgn = lefty ? -1 : 1;
  const cx = lefty ? R * 1.7 : W - R * 1.7;
  const cy = H - R * 1.7;
  const px2 = (dx) => cx + sgn * dx;
  TOUCH_BTNS.push({ key: 'j', label: '斩', x: cx, y: cy, r: R * 1.3, col: '#dce6f5', fill: 'rgba(58,78,108,0.6)' });
  TOUCH_BTNS.push({ key: 'shift', label: '冲', x: cx, y: cy - R * 3.1, r: R, col: '#9fdcf5', fill: 'rgba(40,70,100,0.55)' });
  TOUCH_BTNS.push({ key: 'k', label: '滚', x: px2(-R * 2.7), y: cy, r: R, col: '#b8c8dc', fill: 'rgba(50,64,90,0.55)' });
  TOUCH_BTNS.push({ key: 'f', label: '魂', x: px2(-R * 2.5), y: cy - R * 2.8, r: R * 0.95, col: '#c8b0ff', fill: 'rgba(62,52,104,0.55)' });
  TOUCH_BTNS.push({ key: 'r', label: '瓶', x: px2(-R * 4.6), y: cy + R * 0.1, r: R * 0.85, col: '#f0b98a', fill: 'rgba(92,62,42,0.55)' });
  TOUCH_BTNS.push({ key: 'e', label: 'E', x: px2(-R * 4.4), y: cy - R * 2.4, r: R * 0.85, col: '#ffd89a', fill: 'rgba(92,76,42,0.55)' });
  TOUCH_BTNS.push({ key: 'block', label: '挡', x: px2(-R * 4.5), y: cy - R * 4.3, r: R * 0.95, col: '#b6e0ff', fill: 'rgba(46,72,96,0.6)' });
  // 视野缩放（放在另一端角落，避开战斗区）
  const zx = lefty ? W - R * 1.2 : W - R * 1.2;
  TOUCH_BTNS.push({ key: 'zoomin', label: '＋', x: zx, y: R * 1.7, r: R * 0.78, col: '#cfe0f0', fill: 'rgba(40,54,74,0.5)' });
  TOUCH_BTNS.push({ key: 'zoomout', label: '－', x: zx - R * 1.9, y: R * 1.7, r: R * 0.78, col: '#cfe0f0', fill: 'rgba(40,54,74,0.5)' });
}
function inButton(x, y) {
  for (const b of TOUCH_BTNS) {
    if (Math.hypot(x - b.x, y - b.y) < b.r * 1.15) return b;
  }
  return null;
}
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  initAudio();
  for (const t of e.changedTouches) {
    const gb = game.gearBtn;
    if (gb && Math.hypot(t.clientX - gb.x, t.clientY - gb.y) < gb.r + 12) {
      if (game.settings) closeSettings(); else openSettings();
      continue;
    }
    if (game.settings) {
      const st = game.settings;
      if (st.waiting) { st.waiting = null; continue; }
      let done = false;
      for (const h of (st.hit || [])) {
        if (t.clientX >= h.x && t.clientX <= h.x + h.w && t.clientY >= h.y && t.clientY <= h.y + h.h) {
          st.sel = h.i;
          if (h.i < ACTIONS.length) st.waiting = ACTIONS[h.i].id;
          else if (h.i === ACTIONS.length) resetBinds();
          else if (h.i === ACTIONS.length + 1) cycleLayout();
          else closeSettings();
          done = true;
          break;
        }
      }
      if (done) continue;
    }
    const b = inButton(t.clientX, t.clientY);
    if (b) {
      pressed[b.key] = true;
      keys[b.key] = true;
      b.flash = 0.12;
      continue;
    }
    if (mobileLayout === 'left' ? (t.clientX > W * 0.5 && t.clientY > H * 0.45 && touch.joyId === null) : (t.clientX < W * 0.5 && t.clientY > H * 0.45 && touch.joyId === null)) {
      touch.joyId = t.identifier;
      touch.joyCX = t.clientX;
      touch.joyCY = t.clientY;
      touch.joyX = 0;
      touch.joyY = 0;
      touch.active = true;
    }
  }
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier !== touch.joyId) continue;
    const dx = t.clientX - touch.joyCX;
    const dy = t.clientY - touch.joyCY;
    const len = Math.hypot(dx, dy) || 1;
    const max = 52;
    const k = len > max ? max / len : 1;
    touch.joyX = (dx * k) / max;
    touch.joyY = (dy * k) / max;
  }
}, { passive: false });
function endTouch(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === touch.joyId) {
      touch.joyId = null;
      touch.joyX = 0;
      touch.joyY = 0;
      touch.active = false;
    }
    for (const b of TOUCH_BTNS) {
      if (keys[b.key] && b.key !== 'j') keys[b.key] = false;
    }
  }
}
canvas.addEventListener('touchend', endTouch, { passive: false });
canvas.addEventListener('touchcancel', endTouch, { passive: false });

// ---------------- 音频（Web Audio 合成，无需外部文件） ----------------
let actx = null;
function initAudio() {
  if (actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (err) {
    actx = null;
  }
  if (actx) startMusic();
}
function tone(freq, dur, type, vol, slideTo) {
  if (!actx) return;
  type = type || 'sine';
  vol = (vol === undefined || vol === null) ? 0.12 : vol;
  const t0 = actx.currentTime;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(actx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.03);
}
function noiseBurst(dur, vol, cutoff) {
  if (!actx) return;
  const len = Math.max(1, Math.floor(actx.sampleRate * dur));
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = actx.createBufferSource();
  src.buffer = buf;
  const f = actx.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.value = cutoff || 1500;
  const g = actx.createGain();
  g.gain.value = vol || 0.08;
  src.connect(f).connect(g).connect(actx.destination);
  src.start();
}

// 点是否落在墙体内（pad 为额外的容差半径）
function hitWall(px, py, pad) {
  const p = pad || 0;
  for (const w of WALLS) {
    if (px > w.x - p && px < w.x + w.w + p && py > w.y - p && py < w.y + w.h + p) return true;
  }
  return false;
}

// 两点之间是否被墙挡住（用来判断敌人能不能看见你）
function losBlocked(x1, y1, x2, y2) {
  const dist = Math.hypot(x2 - x1, y2 - y1);
  const steps = Math.min(24, Math.ceil(dist / 26));
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    if (hitWall(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t, 0)) return true;
  }
  return false;
}

// ---------------- 碰撞辅助 ----------------
function resolveObstacles(ent) {
  for (const o of obstacles) {
    const dx = ent.x - o.x;
    const dy = ent.y - o.y;
    const d = Math.hypot(dx, dy);
    const min = ent.r + o.r;
    if (d < min && d > 0.001) {
      ent.x = o.x + dx / d * min;
      ent.y = o.y + dy / d * min;
    }
  }
  // 矩形墙体：圆对 AABB 的推出
  for (const w of WALLS) {
    const cx = clamp(ent.x, w.x, w.x + w.w);
    const cy = clamp(ent.y, w.y, w.y + w.h);
    let dx = ent.x - cx;
    let dy = ent.y - cy;
    let d = Math.hypot(dx, dy);
    if (d < 0.001) {
      // 圆心落在墙内：推向最近的边
      const left = ent.x - w.x, right = w.x + w.w - ent.x;
      const top = ent.y - w.y, bottom = w.y + w.h - ent.y;
      const m = Math.min(left, right, top, bottom);
      if (m === left) ent.x = w.x - ent.r;
      else if (m === right) ent.x = w.x + w.w + ent.r;
      else if (m === top) ent.y = w.y - ent.r;
      else ent.y = w.y + w.h + ent.r;
      continue;
    }
    if (d < ent.r) {
      const push = (ent.r - d) / d;
      ent.x += dx * push;
      ent.y += dy * push;
    }
  }
  ent.x = clamp(ent.x, ent.r, WORLD.w - ent.r);
  ent.y = clamp(ent.y, ent.r, WORLD.h - ent.r);
}

function pushApart(list) {
  for (let i = 0; i < list.length; i++) {
    for (let j = i + 1; j < list.length; j++) {
      const a = list[i];
      const b = list[j];
      if (a.dead || b.dead) continue;
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const d = Math.hypot(dx, dy);
      const min = a.r + b.r;
      if (d > 0.001 && d < min) {
        const push = (min - d) / 2;
        a.x -= dx / d * push;
        a.y -= dy / d * push;
        b.x += dx / d * push;
        b.y += dy / d * push;
      }
    }
  }
}

// ---------------- 玩家行为 ----------------
function toggleLock() {
  if (lockTarget && !lockTarget.dead) {
    lockTarget = null;
    return;
  }
  let best = null;
  let bestD = 720;
  const all = enemies.slice();
  if (boss && !boss.dead && boss.aggro) all.push(boss);
  for (const e of all) {
    if (e.dead) continue;
    const d = dist(player, e);
    if (d < bestD) { bestD = d; best = e; }
  }
  lockTarget = best;
}

function startRoll(p, ix, iy) {
  let dx = ix;
  let dy = iy;
  if (!dx && !dy) {
    dx = Math.cos(p.facing);
    dy = Math.sin(p.facing);
  }
  p.state = 'roll';
  p.stateT = 0;
  p.rollDx = dx;
  p.rollDy = dy;
  p.facing = Math.atan2(dy, dx);
  p.stamina -= 25;
  p.staminaDelay = 0.7;
  p.invuln = 0.34;
  p.attackHitDone = true;
  sfx.roll();
}

function aimAt(p) {
  if (lockTarget && !lockTarget.dead) {
    p.facing = Math.atan2(lockTarget.y - p.y, lockTarget.x - p.x);
    return;
  }
  let best = null;
  let bestD = 1e9;
  const all = enemies.slice();
  if (boss && !boss.dead && boss.aggro) all.push(boss);
  for (const e of all) {
    if (e.dead) continue;
    const d = dist(p, e);
    const a = Math.atan2(e.y - p.y, e.x - p.x);
    if (d < 190 && Math.abs(angleDiff(a, p.facing)) < 1.0 && d < bestD) {
      bestD = d;
      best = e;
    }
  }
  if (best) p.facing = Math.atan2(best.y - p.y, best.x - p.x);
}

function startShoot(p) {
  const k = wpnKind();
  const cost = k === 'gun' ? 22 : 14;
  if (p.stamina < cost) {
    p.staminaDelay = 0.8;
    return false;
  }
  p.state = 'shoot';
  p.stateT = 0;
  p.attackId++;
  p.shotDone = false;
  p.stamina -= cost;
  p.staminaDelay = 0.6;
  aimAt(p);
  return true;
}

function fireWeaponShot(p) {
  const k = wpnKind();
  const speed = k === 'gun' ? 940 : 620;
  const life = k === 'gun' ? 0.3 : 0.95;
  projectiles.push({
    x: p.x + Math.cos(p.facing) * 16,
    y: p.y + Math.sin(p.facing) * 16 - 6,
    vx: Math.cos(p.facing) * speed,
    vy: Math.sin(p.facing) * speed,
    r: k === 'gun' ? 4 : 5,
    dmg: atkDmg(COMBO[0]),
    life: life,
    maxLife: life,
    hitList: [],
    ang: p.facing,
    kind: k === 'gun' ? 'bullet' : 'arrow',
  });
  game.shake = Math.max(game.shake, k === 'gun' ? 11 : 4);
  addEffect({ kind: 'puff', x: p.x + Math.cos(p.facing) * 20, y: p.y + Math.sin(p.facing) * 20 - 6, life: 0.22, maxLife: 0.22, color: k === 'gun' ? '#ffd8a0' : '#cfe0f0' });
  sfx.spellHit();
}

function startAttack(p, chain) {
  const kind = wpnKind();
  if (kind === 'bow' || kind === 'gun') {
    startShoot(p);
    return;
  }
  if (chain && p.combo < COMBO.length - 1) {
    p.combo++;
  } else if (!chain && p.comboT > 0 && p.combo < COMBO.length - 1) {
    p.combo++;
  } else {
    p.combo = 0;
  }
  p.comboT = 0;
  p.comboQueued = false;
  const c = COMBO[p.combo] || COMBO[0];
  p.state = 'attack';
  p.stateT = 0;
  p.attackId++;
  p.attackHitDone = false;
  p.stamina -= c.stamina;
  p.staminaDelay = 0.7;
  aimAt(p);
  if (p.combo === 1) addFloater(p.x, p.y - 26, '反手斩', '#cfe4ff');
  else if (p.combo === 2) addFloater(p.x, p.y - 26, '重劈', '#ffd89a');
  sfx.swing();
}

function startDash(p, ix, iy) {
  let dx = ix;
  let dy = iy;
  if (!dx && !dy) {
    dx = Math.cos(p.facing);
    dy = Math.sin(p.facing);
  }
  const l = Math.hypot(dx, dy) || 1;
  dx /= l;
  dy /= l;
  p.state = 'dash';
  p.stateT = 0;
  p.dashDx = dx;
  p.dashDy = dy;
  p.facing = Math.atan2(dy, dx);

  projectiles.push({
    x: p.x + Math.cos(p.facing) * 14,

    vx: Math.cos(p.facing) * speed,

    r: 9,
    dmg: 30,
    life: 1.0,
    maxLife: 1.0,
    hitList: [],
    ang: p.facing,
  });
}

function updateProjectiles(dt) {
  for (const s of projectiles) {
    s.life -= dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    for (const o of obstacles) {
      if (Math.hypot(s.x - o.x, s.y - o.y) < o.r + s.r * 0.5) s.life = 0;
    }
    if (hitWall(s.x, s.y, s.r * 0.6)) {
      s.life = 0;
      addEffect(makeShockwave(s.x, s.y, '#9be7ff'));
    }
    if (s.x < 0 || s.y < 0 || s.x > WORLD.w || s.y > WORLD.h) s.life = 0;
    const all = enemies.slice();
    if (boss && !boss.dead && boss.aggro) all.push(boss);
    for (const e of all) {
      if (e.dead || s.hitList.indexOf(e) >= 0) continue;
      if (Math.hypot(e.x - s.x, e.y - s.y) < e.r + s.r) {
        s.hitList.push(e);
        damageEnemy(e, s.dmg, s.ang, true, true);
        addEffect(makeShockwave(s.x, s.y, '#9be7ff'));
        game.hitStop = Math.max(game.hitStop, 0.045);
        game.shake = Math.max(game.shake, 6);
        sfx.spellHit();
        s.life = 0;
      }
    }
  }
  projectiles = projectiles.filter(s => s.life > 0);
}

// ---------------- 敌人的远程攻击 ----------------
let eProjectiles = [];

function fireEnemyShot(e) {
  const a = Math.atan2(player.y - e.y, player.x - e.x);
  eProjectiles.push({
    x: e.x + Math.cos(a) * 14,
    y: e.y + Math.sin(a) * 14 - 4,
    vx: Math.cos(a) * 250,
    vy: Math.sin(a) * 250,
    ang: a,
    r: 4,
    dmg: e.dmg,
    life: 2.6,
    owner: e,
  });
  addEffect(makeSlashEffect(e.x + Math.cos(a) * 18, e.y + Math.sin(a) * 18, a, '#a8e6c0'));
  sfx.swing();
}

function updateEProjectiles(dt) {
  for (const s of eProjectiles) {
    s.life -= dt;
    if (s.life <= 0) continue;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    if (s.x < 0 || s.y < 0 || s.x > WORLD.w || s.y > WORLD.h) {
      s.life = 0;
      continue;
    }
    for (const o of obstacles) {
      if (Math.hypot(s.x - o.x, s.y - o.y) < o.r + s.r * 0.5) {
        s.life = 0;
        addEffect(makeDeathPuff(s.x, s.y, '#8a8f99'));
        break;
      }
    }
    if (s.life > 0 && hitWall(s.x, s.y, s.r * 0.6)) {
      s.life = 0;
      addEffect(makeDeathPuff(s.x, s.y, '#8a8f99'));
    }
    if (s.life <= 0) continue;
    if (!player.dead && player.invuln <= 0 &&
      Math.hypot(player.x - s.x, player.y - s.y) < player.r + s.r) {
      const r = damagePlayer(s.dmg, s.x, s.y, s.owner);
      if (r === 'parry') {
        // 完美格挡把箭弹开
        addEffect(makeShockwave(s.x, s.y, '#ffe9a0'));
      } else {
        addEffect(makeShockwave(s.x, s.y, '#ff9a6a'));
      }
      s.life = 0;
      continue;
    }
    // 箭矢也会误伤别的敌人（友军伤害）
    for (const e of enemies) {
      if (e.dead || e === s.owner) continue;
      if (Math.hypot(e.x - s.x, e.y - s.y) < e.r + s.r) {
        damageEnemy(e, Math.max(1, Math.round(s.dmg * 0.7)), Math.atan2(s.vy, s.vx), false);
        addEffect(makeDeathPuff(s.x, s.y, '#c8d0da'));
        s.life = 0;
        break;
      }
    }
  }
  eProjectiles = eProjectiles.filter(s => s.life > 0);
}

function drawEProjectiles() {
  for (const s of eProjectiles) {
    if (!visible(s.x, s.y, 20)) continue;
    G.save();
    G.translate(s.x, s.y);
    G.rotate(s.ang);
    px(-8, -1, 12, 2, '#6b5232');
    px(2, -1, 5, 2, '#c9d4e0');
    px(7, 0, 3, 1, '#eef4fa');
    px(-10, -2, 3, 4, '#9ad6b0');
    G.restore();
  }
}

    list.push({
      id: 'w:' + id,
      name: w.name,
      price: w.price,
      desc: w.desc,
      kind: 'weapon',
      weapon: id,
      owned: player.ownedWeapons.indexOf(id) >= 0,
      equipped: player.weapon === id,
    });
  }
  for (const id in ARMORS) {

    list.push({
      id: 'a:' + id,
      name: a.name,
      price: a.price,
      desc: a.desc,
      kind: 'armor',
      armor: id,
      owned: (player.ownedArmors || []).indexOf(id) >= 0,
      equipped: player.armor === id,
    });
  }
  return list;
}

  p.spinHit2 = false;
  p.stamina -= SPECIALS.spin.stamina;
  p.staminaDelay = 0.85;
  p.invuln = Math.max(p.invuln, 0.1);
  p.combo = 0;
  p.comboT = 0;
  addFloater(p.x, p.y - 26, '回旋斩', '#ffe0a0');
  sfx.swing();
}

function playerSpecialHit(kind) {
  const p = player;
  const s = kind === 'spin' ? SPECIALS.spin : SPECIALS.dash;
  p.attackId++;
  const cx = kind === 'spin' ? p.x : p.x + Math.cos(p.facing) * s.reach;
  const cy = kind === 'spin' ? p.y : p.y + Math.sin(p.facing) * s.reach;
  const sdmg = Math.round(s.dmg * wpn().dmg);
  let hitAny = false;
  const all = enemies.slice();
  if (boss && !boss.dead && boss.aggro) all.push(boss);
  for (const e of all) {
    if (e.dead || e.lastAttackId === p.attackId) continue;
    if (Math.hypot(e.x - cx, e.y - cy) < s.hitR + e.r) {
      e.lastAttackId = p.attackId;
      const a = Math.atan2(e.y - p.y, e.x - p.x);
      damageEnemy(e, sdmg, a);
      e.x += Math.cos(a) * 12;
      e.y += Math.sin(a) * 12;
      hitAny = true;
    }
  }
  if (hitAny) {
    game.hitStop = Math.max(game.hitStop, 0.07);
    game.shake = Math.max(game.shake, 9);
    addEffect(makeSlashEffect(cx, cy, kind === 'spin' ? p.stateT * 18 : p.facing));
    if (kind === 'spin') addEffect(makeShockwave(p.x, p.y, '#ffe6b0'));
  }
}

// ---------------- 难度分级 ----------------
// 三档用同一套关卡与敌人配置，只调数值，方便新手入门、老手加码
const DIFFS = {

};
const DIFF_ORDER = ['easy', 'normal', 'hard'];
let diffKey = 'normal';
function D() { return DIFFS[diffKey] || DIFFS.normal; }

// 三段连招：轻斩 → 反手斩 → 重劈
const COMBO = [
  { dmg: 15, reach: 42, hitR: 30, hitAt: 0.09, total: 0.34, stamina: 16, shake: 6, kb: 10, arc: 1.9, spin: 1 },
  { dmg: 15, reach: 44, hitR: 31, hitAt: 0.08, total: 0.30, stamina: 15, shake: 6, kb: 14, arc: 2.2, spin: -1 },
  { dmg: 30, reach: 56, hitR: 40, hitAt: 0.15, total: 0.54, stamina: 24, shake: 13, kb: 34, arc: 2.6, spin: 1 },
];

function playerAttackHit() {
  const p = player;
  const c = COMBO[p.combo] || COMBO[0];
  const reach = atkReach(c);
  const cx = p.x + Math.cos(p.facing) * reach;
  const cy = p.y + Math.sin(p.facing) * reach;
  const hitR = c.hitR;
  let hitAny = false;
  const all = enemies.slice();
  if (boss && !boss.dead && boss.aggro) all.push(boss);
  for (const e of all) {
    if (e.dead) continue;
    if (e.lastAttackId === p.attackId) continue;
    if (Math.hypot(e.x - cx, e.y - cy) < hitR + e.r) {
      e.lastAttackId = p.attackId;
      damageEnemy(e, atkDmg(c), p.facing);
      if (c.kb > 16) {
        e.x += Math.cos(p.facing) * (c.kb - 16);
        e.y += Math.sin(p.facing) * (c.kb - 16);
      }
      hitAny = true;
    }
  }
  if (hitAny) {
    game.hitStop = p.combo === 2 ? 0.1 : 0.055;
    game.shake = Math.max(game.shake, c.shake);
    addEffect(makeSlashEffect(cx, cy, p.facing));
    addEffect({ kind: 'spark', x: cx, y: cy, life: 0.24, maxLife: 0.24, ang: p.facing, color: p.combo === 2 ? '#ffd9a0' : '#cfeaff' });
    if (p.combo === 2) {
      addEffect(makeShockwave(cx, cy, '#ffe6b0'));
      game.comboHud = { t: 0.9, n: 3 };
    } else {
      game.comboHud = { t: 0.55, n: p.combo + 1 };
    }
  }
}

function damageEnemy(e, dmg, dir, byPlayer, pierce) {
  if (e.dead) return;
  if (byPlayer === undefined) byPlayer = true;
  // 术士的护盾：减伤一半
  if (e.wardT > 0) {
    dmg = Math.max(1, Math.round(dmg * 0.5));
    if (byPlayer) addFloater(e.x, e.y - e.r - 10, '护盾', '#b8a6ff');
  }
  // 盾兵：正面格挡；重劈或法术可以直接破盾
  if (e.shield && e.guardT <= 0) {
    const front = Math.abs(angleDiff(dir, e.facing + Math.PI)) < 1.15;
    if (front) {
      if (dmg >= 28 || pierce) {
        e.guardT = 1.6;
        addFloater(e.x, e.y - e.r - 8, pierce ? '法术破盾' : '破防', '#ffd89a');
        game.shake = Math.max(game.shake, 9);
        game.hitStop = Math.max(game.hitStop, 0.08);
        addEffect(makeShockwave(e.x, e.y, '#ffe6b0'));
        if (e.state === 'windup' || e.state === 'active') {
          e.state = 'stagger';
          e.stateT = 0;
          e.hitDone = true;
        }
      } else {
        const chip = Math.max(1, Math.round(dmg * 0.15));
        e.hp -= chip;
        e.flash = 0.1;
        addFloater(e.x, e.y - e.r - 8, '格挡 -' + chip, '#cfe0ff');
        addEffect(makeShockwave(e.x, e.y, '#9fc6e8'));
        sfx.hit();
        // 举盾格挡时被打会打断出招，并往后顶一步
        if (e.state === 'windup' || e.state === 'active') {
          e.state = 'stagger';
          e.stateT = 0;
          e.hitDone = true;
          e.x += Math.cos(dir) * 2;
          e.y += Math.sin(dir) * 2;
        }
        if (e.hp <= 0) killEnemy(e, byPlayer);
        return;
      }
    }
  }
  e.hp -= dmg;
  e.flash = 0.14;
  if (byPlayer) player.soul = Math.min(player.soulMax, player.soul + 8);
  if (e !== boss) {
    e.state = 'stagger';
    e.stateT = 0;
  }
  const kb = e === boss ? 5 : 16;
  e.x += Math.cos(dir) * kb;
  e.y += Math.sin(dir) * kb;
  addFloater(e.x, e.y - e.r - 6, '-' + dmg, byPlayer ? '#ffe08a' : '#ff9aa0');
  sfx.hit();
  if (e.hp <= 0) killEnemy(e, byPlayer);
}

function killEnemy(e, byPlayer) {
  if (e === boss) {
    if (bossDefeated) return;
    bossDefeated = true;
    boss.dead = true;
    boss.hp = 0;
    player.souls += 600;
    game.state = 'victory';
    game.victoryTimer = 0;
    lockTarget = null;
    sfx.victory();
    addEffect(makeShockwave(boss.x, boss.y, '#c9a0ff'));
    addEffect(makeDeathPuff(boss.x, boss.y, '#b48cff'));
    return;
  }
  if (e.dead) return;
  e.dead = true;
  e.hp = 0;
  if (byPlayer !== false) {
    player.souls += e.souls;
    addFloater(e.x, e.y - e.r, '+' + e.souls, '#9be7ff');
  } else {
    addFloater(e.x, e.y - e.r, '误伤致死', '#ff9aa0');
  }
  addEffect(makeDeathPuff(e.x, e.y, e.color));
  sfx.soul();
}

// 完美格挡后的反击：只有近战武器能用，且只能打贴身的近战敌人（射手不行）
function tryRiposte(src) {
  const p = player;
  if (!src || src.dead) return false;
  if (src.type === 'archer') return false;
  const kind = wpnKind();
  if (kind !== 'sword' && kind !== 'spear' && kind !== 'shield') return false;
  const d = Math.hypot(src.x - p.x, src.y - p.y);
  if (d > 86) return false;
  const ang = Math.atan2(src.y - p.y, src.x - p.x);
  p.facing = ang;
  const dmg = Math.round(atkDmg(COMBO[2]) * 1.25);
  src.x += Math.cos(ang) * 10;
  src.y += Math.sin(ang) * 10;
  damageEnemy(src, dmg, ang, true);
  addFloater(src.x, src.y - src.r - 22, '反击 -' + dmg, '#ffd27a');
  addEffect(makeShockwave(src.x, src.y, '#ffd27a'));
  addEffect({ kind: 'slash', x: src.x, y: src.y, life: 0.26, maxLife: 0.26, ang, reach: 30 });
  game.shake = Math.max(game.shake, 13);
  game.hitStop = Math.max(game.hitStop, 0.08);
  return true;
}

function damagePlayer(dmg, sx, sy, src) {
  const p = player;
  if (p.dead || p.invuln > 0) return 'none';
  dmg = Math.max(1, Math.round(dmg * D().enemyDmg));

  // 举盾格挡：攻击来自正面才有效
  if (p.state === 'block') {
    const ang = (sx === undefined) ? p.facing : Math.atan2(sy - p.y, sx - p.x);
    const fromFront = Math.abs(angleDiff(ang, p.facing)) < 1.5;
    if (fromFront) {
      if (p.parryWin > 0) {
        // 完美格挡：零伤害、回魂、敌人硬直（由调用方处理）
        p.parryWin = 0;
        p.invuln = 0.25;
        p.soul = Math.min(p.soulMax, p.soul + 18);
        game.hitStop = 0.09;
        game.shake = Math.max(game.shake, 9);
        game.parryFlash = 0.22;
        addFloater(p.x, p.y - p.r - 8, '完美格挡', '#ffe9a0');
        addEffect({ kind: 'shock', x: p.x, y: p.y, life: 0.42, maxLife: 0.42, color: '#ffe9a0' });
        sfx.parry();
        if (tryRiposte(src)) {
          addFloater(p.x, p.y - p.r - 20, '完美格挡 · 反击', '#ffe9a0');
        }
        return 'parry';
      }
      if (p.stamina >= 20) {
        // 普通格挡：扣耐力，伤害只剩 15%
        p.stamina -= 20;
        p.staminaDelay = 0.6;
        const reduced = Math.max(1, Math.round(dmg * 0.15));
        p.hp -= reduced;
        p.invuln = 0.35;
        game.shake = Math.max(game.shake, 6);
        game.hitStop = 0.04;
        addFloater(p.x, p.y - p.r - 8, '格挡 -' + reduced, '#cfe0f0');
        addEffect({ kind: 'puff', x: p.x + Math.cos(p.facing) * 16, y: p.y + Math.sin(p.facing) * 16, life: 0.3, maxLife: 0.3, color: '#cfe0f0' });
        sfx.block();
        // 普通格挡也把贴身近战敌人顶开一步，并打断它的出招
        if (src && !src.dead && src.type !== 'archer') {
          const dd = Math.hypot(src.x - p.x, src.y - p.y);
          if (dd < 82) {
            const a2 = Math.atan2(src.y - p.y, src.x - p.x);
            src.x += Math.cos(a2) * 10;
            src.y += Math.sin(a2) * 10;
            if (src.state === 'windup' || src.state === 'active') {
              src.state = 'stagger';
              src.stateT = 0;
              src.hitDone = true;
            }
            addEffect({ kind: 'puff', x: src.x, y: src.y, life: 0.22, maxLife: 0.22, color: '#bfd6ea' });
          }
        }
        if (p.hp <= 0) {
          p.hp = 0;
          killPlayer();
        }
        return 'block';
      }
      // 耐力不够：破防，吃满伤害且硬直更久
      p.stamina = 0;
      p.staminaDelay = 1.1;
      p.staggerT = 0.75;
      addFloater(p.x, p.y - p.r - 8, '破防', '#ff9a6a');
      sfx.guardBreak();
    }
  }

  const av = armorValue();
  const taken = av > 0 ? Math.max(1, Math.round(dmg * (1 - av / (av + 40)))) : dmg;
  p.hp -= taken;
  p.invuln = 0.8;
  p.flash = 0.25;
  p.soul = Math.max(0, p.soul - 10);
  game.shake = Math.max(game.shake, 14);
  game.hitStop = 0.05;
  addFloater(p.x, p.y - p.r - 4, '-' + taken, av > 0 ? '#ffb08a' : '#ff6b6b');
  sfx.hurt();
  if (p.hp <= 0) {
    p.hp = 0;
    killPlayer();
  } else {
    p.state = 'hurt';
    p.stateT = 0;
  }
  return 'hit';
}

function killPlayer() {
  const p = player;
  p.dead = true;
  p.state = 'dead';
  bloodstain = { x: p.x, y: p.y, souls: p.souls, pulse: 0 };
  p.souls = 0;
  game.state = 'dead';
  game.deathTimer = 0;
  game.shake = 20;
  sfx.die();
}

function respawnPlayer() {
  const p = player;
  p.dead = false;
  p.hp = p.maxHp;
  p.stamina = p.maxStamina;
  p.flasks = p.maxFlasks;
  p.x = bonfire.x;
  p.y = bonfire.y - 90;
  p.state = 'idle';
  p.stateT = 0;
  p.invuln = 1.4;
  if (!D().keepSouls) p.souls = 0;   // 拾薪者难度不掉魂
  p.soul = 0;
  p.flash = 0;
  p.staminaDelay = 0;
  resetEnemies();
  game.state = 'playing';
  game.deathTimer = 0;
  game.camX = clamp(p.x - viewW() / 2, 0, Math.max(0, WORLD.w - viewW()));
  game.camY = clamp(p.y - viewH() / 2, 0, Math.max(0, WORLD.h - viewH()));
}

function restAtBonfire() {
  const p = player;
  p.hp = p.maxHp;
  p.stamina = p.maxStamina;
  p.staminaDelay = 0;
  p.flasks = p.maxFlasks;
  p.invuln = 0.6;
  resetEnemies();
  game.toast = { text: '篝火已点燃 · 敌人已重生', t: 2.4 };
  game.shake = 4;
  sfx.bonfire();
}

// ---------------- 更新：玩家 ----------------
function updatePlayer(dt) {
  const p = player;
  p.stateT += dt;
  p.invuln = Math.max(0, p.invuln - dt);
  p.flash = Math.max(0, p.flash - dt);
  p.staminaDelay = Math.max(0, p.staminaDelay - dt);

  if (p.dead) return;

  // 移动输入
  let ix = 0;
  let iy = 0;
  if (keys['a'] || keys['arrowleft'] || touch.joyX < -0.3) ix -= 1;
  if (keys['d'] || keys['arrowright'] || touch.joyX > 0.3) ix += 1;
  if (keys['w'] || keys['arrowup'] || touch.joyY < -0.3) iy -= 1;
  if (keys['s'] || keys['arrowdown'] || touch.joyY > 0.3) iy += 1;
  const il = Math.hypot(ix, iy);
  if (il > 0) {
    ix /= il;
    iy /= il;
  }

  // 冲刺与法术（在状态机之前拦输入）
  p.dashCd = Math.max(0, p.dashCd - dt);
  p.parryWin = Math.max(0, p.parryWin - dt);
  const canAct = p.state !== 'roll' && p.state !== 'attack' &&
                 p.state !== 'dash' && p.state !== 'cast' && p.state !== 'hurt' &&
                 p.state !== 'block';
  if (pressed['shift'] && canAct && p.dashCd <= 0 && p.stamina >= 14) {
    startDash(p, ix, iy);
  } else if (pressed['f'] && canAct && p.soul >= 33) {
    startCast(p);
  }

  // 原素瓶
  if (pressed['r'] && p.flasks > 0 && p.hp < p.maxHp &&
      p.state !== 'roll' && p.state !== 'attack' && p.state !== 'hurt') {
    p.flasks--;
    p.hp = Math.min(p.maxHp, p.hp + 45);
    addFloater(p.x, p.y - p.r - 10, '+45', '#ffb0a0');
    game.toast = { text: '饮用原素瓶', t: 1.2 };
    sfx.soul();
  }

  // 锁定切换
  if (pressed['tab']) toggleLock();

  // 武器切换：Q 轮换，数字键直接选
  if (pressed['q']) cycleWeapon(1);
  for (let i = 0; i < 8; i++) {
    if (pressed[String(i + 1)]) selectWeapon(i);
  }

  // 连招窗口：出招结束后 0.62 秒内再按攻击可接下一段
  if (p.state !== 'attack' && p.comboT > 0) {
    p.comboT = Math.max(0, p.comboT - dt);
    if (p.comboT === 0) p.combo = 0;
  }

  // 耐力恢复
  if (p.staminaDelay <= 0 && p.state !== 'roll' && p.state !== 'attack' && p.state !== 'block') {
    p.stamina = Math.min(p.maxStamina, p.stamina + 32 * D().staminaRegen * dt);
  }

  // 状态机
  if (p.state === 'idle' || p.state === 'walk') {
    if ((keys['l'] || keys['mouse2'] || keys['block']) && p.stamina > 8) {
      p.state = 'block';
      p.stateT = 0;
      p.parryWin = D().parry;   // 起手窗口内挡到 = 完美格挡（难度可调）
      sfx.block();
    } else if ((pressed['k'] || pressed[' ']) && p.stamina >= 25) {
      startRoll(p, ix, iy);
    } else if ((pressed['j'] || pressed['mouse']) && p.stamina >= 15) {
      startAttack(p);
    } else if (il > 0) {
      p.facing = Math.atan2(iy, ix);
      p.x += ix * p.speed * dt;
      p.y += iy * p.speed * dt;
      p.state = 'walk';
      p.walkPhase += dt * 10;
      p.stepT = (p.stepT || 0) - dt;
      if (p.stepT <= 0) {
        p.stepT = 0.27;
        addEffect({ kind: 'puff', x: p.x + Math.cos(p.facing) * 4, y: p.y + 7, life: 0.34, maxLife: 0.34, color: '#8b8272' });
      }
    } else {
      p.state = 'idle';
    }
  } else if (p.state === 'block') {
    const holding = keys['l'] || keys['mouse2'] || keys['block'];
    p.stamina -= 13 * dt;
    p.staminaDelay = 0.4;
    if (!holding) {
      p.state = 'idle';
      p.stateT = 0;
    } else if (p.stamina <= 0) {
      p.stamina = 0;
      p.state = 'idle';
      p.stateT = 0;
      game.toast = { text: '耐力耗尽 · 破防', t: 1.0 };
    } else {
      if (il > 0) {
        p.x += ix * p.speed * 0.5 * dt;
        p.y += iy * p.speed * 0.5 * dt;
        p.walkPhase += dt * 6;
        p.facing = angleLerp(p.facing, Math.atan2(iy, ix), Math.min(1, 9 * dt));
      } else if (lockTarget && !lockTarget.dead) {
        p.facing = angleLerp(p.facing, Math.atan2(lockTarget.y - p.y, lockTarget.x - p.x), Math.min(1, 9 * dt));
      }
      p.vx = 0;
      p.vy = 0;
      if ((pressed['k'] || pressed[' ']) && p.stamina >= 25) startRoll(p, ix, iy);
    }
  } else if (p.state === 'attack') {
    const c = COMBO[p.combo] || COMBO[0];
    const t = p.stateT;
    if (t >= c.hitAt && !p.attackHitDone) {
      p.attackHitDone = true;
      playerAttackHit();
    }
    // 攻击中允许小幅走位（前半段），保持输出时还能微调站位
    if (il > 0 && t < c.hitAt + 0.12) {
      p.x += ix * p.speed * 0.34 * dt;
      p.y += iy * p.speed * 0.34 * dt;
    }
    if ((pressed['j'] || pressed['mouse'] || keys['j']) && t >= c.hitAt) p.comboQueued = true;
    if ((pressed['k'] || pressed[' ']) && t > 0.1) {
      if (p.combo === 0 && p.stamina >= SPECIALS.dash.stamina && t >= c.hitAt) {
        startDashSlash(p);
      } else if (p.combo === 1 && p.stamina >= SPECIALS.spin.stamina && t >= c.hitAt) {
        startSpin(p);
      } else if (t > 0.18 && p.stamina >= 25) {
        startRoll(p, ix, iy);
      }
    } else if (p.comboQueued && p.combo < COMBO.length - 1 && t >= c.hitAt) {
      startAttack(p, true);
    } else if (t >= atkTotal(c)) {
      p.state = 'idle';
      p.stateT = 0;
      p.comboT = 0.62;
    }
  } else if (p.state === 'shoot') {
    const t = p.stateT;
    const isGun = wpnKind() === 'gun';
    if (t >= 0.1 && !p.shotDone) {
      p.shotDone = true;
      fireWeaponShot(p);
    }
    if (t >= (isGun ? 0.62 : 0.46)) {
      p.state = 'idle';
      p.stateT = 0;
      p.comboT = 0;
    }
  } else if (p.state === 'dashslash') {
    const t = p.stateT;
    if (t < 0.22) {
      p.x += p.dashDx * SPECIALS.dash.moveSpeed * dt;
      p.y += p.dashDy * SPECIALS.dash.moveSpeed * dt;
    }
    if (t >= 0.05 && !p.attackHitDone) {
      p.attackHitDone = true;
      playerSpecialHit('dash');
    }
    if (t >= SPECIALS.dash.dur) {
      p.state = 'idle';
      p.stateT = 0;
      p.comboT = 0.25;
    }
  } else if (p.state === 'spin') {
    const t = p.stateT;
    if (t >= 0.1 && !p.attackHitDone) {
      p.attackHitDone = true;
      playerSpecialHit('spin');
    }
    if (t >= 0.28 && !p.spinHit2) {
      p.spinHit2 = true;
      playerSpecialHit('spin');
    }
    if (t >= SPECIALS.spin.dur) {
      p.state = 'idle';
      p.stateT = 0;
      p.comboT = 0.2;
    }
  } else if (p.state === 'roll') {
    if (p.stateT < 0.34) {
      const sp = 470;
      p.x += p.rollDx * sp * dt;
      p.y += p.rollDy * sp * dt;
    }
    if (p.stateT >= 0.5) {
      p.state = 'idle';
      p.stateT = 0;
    }
  } else if (p.state === 'dash') {
    if (p.stateT < 0.17) {
      const sp = 720;
      p.x += p.dashDx * sp * dt;
      p.y += p.dashDy * sp * dt;
    }
    if (p.stateT >= 0.22) {
      p.state = 'idle';
      p.stateT = 0;
    }
  } else if (p.state === 'cast') {
    if (!p.castDone && p.stateT >= 0.1) {
      p.castDone = true;
      fireSpell(p);
    }
    if (p.stateT >= 0.32) {
      p.state = 'idle';
      p.stateT = 0;
    }
  } else if (p.state === 'hurt') {
    // 破防被打断时硬直更久
    if (p.staggerT > 0) {
      p.staggerT = Math.max(0, p.staggerT - dt);
      p.staminaDelay = 0.6;
    } else if (p.stateT >= 0.32) {
      p.state = 'idle';
      p.stateT = 0;
    }
  }

  // 锁定目标失效检查
  if (lockTarget && (lockTarget.dead || (lockTarget === boss && (!boss || !boss.aggro)))) {
    lockTarget = null;
  }

  resolveObstacles(p);

  // 篝火交互
  const bd = dist(p, bonfire);
  game.nearBonfire = bd < 82;
  const vd = Math.hypot(p.x - vendor.x, p.y - vendor.y);
  game.nearVendor = vd < 78;
  if (pressed['e']) {
    if (vd < 78) openShop();
    else if (game.nearBonfire) restAtBonfire();
  }
}

// ---------------- 商店 ----------------
function openShop() {
  game.state = 'shop';
  game.shopSel = 0;
  game.shopMsg = null;
  game.shopMsgT = 0;
  sfx.bonfire();
}

function closeShop() {
  game.state = 'playing';
  game.shopMsg = null;
  game.shopMsgT = 0;
}

// ---------------- 设置：键位与手机布局 ----------------
function openSettings() {
  game.settings = { sel: 0, waiting: null, msg: '', msgT: 2.2, hit: [] };
  sfx.bonfire();
}
function closeSettings() {
  game.settings = null;
}
function resetBinds() {
  BINDS = Object.assign({}, DEFAULT_BINDS);
  saveBinds();
  if (game.settings) game.settings.msg = '已恢复默认键位';
}
function cycleLayout() {
  const i = MOBILE_PRESETS.findIndex(p => p.id === mobileLayout);
  mobileLayout = MOBILE_PRESETS[(i + 1) % MOBILE_PRESETS.length].id;
  try { localStorage.setItem('ashen_layout', mobileLayout); } catch (e) {}
  layoutTouchButtons();
  if (game.settings) game.settings.msg = '手机布局：' + MOBILE_PRESETS.find(p => p.id === mobileLayout).name;
}
function updateSettings(dt) {
  const st = game.settings;
  if (!st) return;
  if (st.msg && st.msgT > 0) st.msgT -= dt;
  if (st.waiting) return;
  const n = ACTIONS.length + 4;
  if (pressed['w'] || pressed['arrowup']) { st.sel = (st.sel + n - 1) % n; st.msg = ''; }
  if (pressed['s'] || pressed['arrowdown']) { st.sel = (st.sel + 1) % n; st.msg = ''; }
  if (pressed['j'] || pressed['enter'] || pressed[' ']) {
    if (st.sel < ACTIONS.length) st.waiting = ACTIONS[st.sel].id;
    else if (st.sel === ACTIONS.length) resetBinds();
    else if (st.sel === ACTIONS.length + 1) {
      const i = DIFF_ORDER.indexOf(diffKey);
      diffKey = DIFF_ORDER[(i + 1) % DIFF_ORDER.length];
      resetEnemies();
      boss = makeBoss();
      st.msg = '难度：' + D().name + '（' + D().tag + '）· 敌人已按新数值重生';
      st.msgT = 3;
    } else if (st.sel === ACTIONS.length + 2) cycleLayout();
    else closeSettings();
  }
  if (pressed['tab']) { st.sel = 0; }
}

function buyItem(it) {
  const p = player;
  if (it.owned) {
    if (it.kind === 'weapon') {
      p.weapon = it.weapon;
      game.shopMsg = '换上了 ' + it.name;
      sfx.bonfire();
    } else if (it.kind === 'armor') {
      p.armor = it.armor;
      game.shopMsg = '穿上 ' + it.name + '（护甲 ' + armorValue() + '）';
      sfx.bonfire();
    } else {
      game.shopMsg = '你已经有了';
    }
    game.shopMsgT = 1.6;
    return;
  }
  if (p.souls < it.price) {
    game.shopMsg = '魂不够（还差 ' + (it.price - p.souls) + '）';
    game.shopMsgT = 1.6;
    return;
  }
  p.souls -= it.price;
  if (it.kind === 'weapon') {
    p.ownedWeapons.push(it.weapon);
    p.weapon = it.weapon;
    game.shopMsg = '装备了 ' + it.name;
  } else if (it.kind === 'armor') {
    p.ownedArmors = p.ownedArmors || [];
    p.ownedArmors.push(it.armor);
    p.armor = it.armor;
    game.shopMsg = '穿上 ' + it.name + '（护甲 ' + armorValue() + '）';
  } else if (it.id === 'flask') {
    p.maxFlasks++;
    p.flasks = p.maxFlasks;
    game.shopMsg = '原素瓶 +1';
  } else if (it.id === 'heal') {
    p.hp = p.maxHp;
    game.shopMsg = '生命已回满';
  } else if (it.id === 'soul') {
    p.soulMax += 30;
    game.shopMsg = '灵魂上限 +30';
  } else if (it.id === 'stamina') {
    p.maxStamina += 15;
    p.stamina = p.maxStamina;
    game.shopMsg = '耐力上限 +15';
  }
  game.shopMsgT = 1.6;
  sfx.bonfire();
}

function cycleWeapon(dir) {
  const p = player;
  const list = p.ownedWeapons;
  if (list.length < 2) return;
  let i = list.indexOf(p.weapon);
  if (i < 0) i = 0;
  i = (i + (dir || 1) + list.length) % list.length;
  p.weapon = list[i];
  addFloater(p.x, p.y - p.r - 20, wpn().name, '#cfe0f0');
  sfx.bonfire();
}

function selectWeapon(idx) {
  const p = player;
  const id = p.ownedWeapons[idx];
  if (!id || p.weapon === id) return;
  p.weapon = id;
  addFloater(p.x, p.y - p.r - 20, WEAPONS[id].name, '#cfe0f0');
  sfx.bonfire();
}

function updateShop(dt) {
  if (game.shopMsgT > 0) {
    game.shopMsgT -= dt;
    if (game.shopMsgT <= 0) game.shopMsg = null;
  }
  const list = shopList();
  if (pressed['w'] || pressed['arrowup']) game.shopSel = (game.shopSel + list.length - 1) % list.length;
  if (pressed['s'] || pressed['arrowdown']) game.shopSel = (game.shopSel + 1) % list.length;
  if (pressed['escape'] || pressed['e']) closeShop();
  if (pressed['j'] || pressed['enter']) {
    const it = list[game.shopSel];
    if (it) buyItem(it);
  }
}

// ---------------- 更新：普通敌人 ----------------
function updateEnemies(dt) {
  for (const e of enemies) {
    if (e.dead) continue;
    e.stateT += dt;
    e.flash = Math.max(0, e.flash - dt);
    if (e.guardT > 0) e.guardT = Math.max(0, e.guardT - dt);
    if (e.shotTimer > 0) e.shotTimer -= dt;
    if (e.chargeCd > 0) e.chargeCd -= dt;
    if (e.wardT > 0) e.wardT = Math.max(0, e.wardT - dt);
    if (e.ward) {
      e.wardTimer -= dt;
      if (e.wardTimer <= 0) {
        e.wardTimer = e.ward;
        let warded = 0;
        for (const o of enemies) {
          if (o.dead || o === e) continue;
          if (Math.hypot(o.x - e.x, o.y - e.y) > 230) continue;
          o.wardT = 4.5;
          warded++;
        }
        if (warded > 0) {
          addFloater(e.x, e.y - 28, '护盾 ' + warded, '#b8a6ff');
          addEffect(makeShockwave(e.x, e.y, '#8a7bd8'));
        }
      }
    }
    const d = dist(e, player);
    const ang = Math.atan2(player.y - e.y, player.x - e.x);

    if (e.state === 'stagger') {
      if (e.stateT > 0.32) {
        e.state = 'chase';
        e.stateT = 0;
      }
      resolveObstacles(e);
      continue;
    }

    // 冲锋：直线突进，撞上玩家就撞停
    if (e.state === 'charge') {
      e.facing = e.chargeDir;
      e.x += Math.cos(e.chargeDir) * e.charge * dt;
      e.y += Math.sin(e.chargeDir) * e.charge * dt;
      if (e.stateT > 0.08 && Math.hypot(player.x - e.x, player.y - e.y) < e.r + player.r + 8) {
        const rr = damagePlayer(e.dmg, e.x, e.y, e);
        if (rr === 'parry') {
          e.state = 'stagger';
          e.stateT = 0;
        } else {
          e.state = 'recover';
          e.stateT = 0;
          e.chargeCd = 2.6;
        }
        e.x -= Math.cos(e.chargeDir) * 14;
        e.y -= Math.sin(e.chargeDir) * 14;
        game.shake = Math.max(game.shake, 7);
      } else if (e.stateT > 0.72) {
        e.state = 'recover';
        e.stateT = 0;
        e.chargeCd = 2.6;
      }
      resolveObstacles(e);
      continue;
    }

    // 脱战：玩家跑得够远、或自己离老巢太远，追一会儿就放弃
    if (e.aggro) {
      const farD = Math.hypot(e.x - e.homeX, e.y - e.homeY);
      if (d > 460 || farD > 460) {
        e.leashT = (e.leashT || 0) + dt;
        if (e.leashT > 1.6) {
          e.aggro = false;
          e.leashT = 0;
          e.state = 'idle';
          e.stateT = 0;
        }
      } else {
        e.leashT = 0;
      }
    }

    // 未激活：在出生点附近游荡
    if (!e.aggro) {
      e.wanderT -= dt;
      if (e.wanderT <= 0) {
        e.wanderT = rand(1.4, 3.2);
        e.wanderDir = rand(0, TAU);
      }
      const homeD = Math.hypot(e.x - e.homeX, e.y - e.homeY);
      if (homeD > 190) e.wanderDir = Math.atan2(e.homeY - e.y, e.homeX - e.x);
      e.facing = e.wanderDir;
      e.x += Math.cos(e.wanderDir) * 26 * dt;
      e.y += Math.sin(e.wanderDir) * 26 * dt;
      if (d < D().aggro && !player.dead && !losBlocked(e.x, e.y, player.x, player.y)) {
        e.aggro = true;
        e.state = 'chase';
        e.stateT = 0;
      }
      resolveObstacles(e);
      continue;
    }

    if (player.dead) {
      e.state = 'idle';
      e.aggro = false;
      e.stateT = 0;
      resolveObstacles(e);
      continue;
    }

    if (e.state === 'idle') {
      e.state = 'chase';
      e.stateT = 0;
    } else if (e.state === 'chase') {
      // 盾兵转身慢，给玩家绕后的机会
      e.facing = e.shield ? angleLerp(e.facing, ang, Math.min(1, 2.2 * dt)) : ang;
      if (e.ranged) {
        // 远程：维持距离，够近就搭箭
        if (d > e.keepDist + 40) {
          e.x += Math.cos(ang) * e.speed * dt;
          e.y += Math.sin(ang) * e.speed * dt;
        } else if (d < e.keepDist - 40) {
          e.x -= Math.cos(ang) * e.speed * dt;
          e.y -= Math.sin(ang) * e.speed * dt;
        }
        if (d < e.atkRange && e.shotTimer <= 0) {
          e.state = 'windup';
          e.stateT = 0;
          e.hitDone = false;
        }
      } else if (e.charge && d < 250 && d > 70 && e.chargeCd <= 0) {
        e.state = 'charge';
        e.stateT = 0;
        e.chargeDir = ang;
        addFloater(e.x, e.y - 30, '冲锋', '#ffb08a');
      } else {
        if (d > e.atkRange) {
          e.x += Math.cos(ang) * e.speed * dt;
          e.y += Math.sin(ang) * e.speed * dt;
        }
        if (d <= e.atkRange + 6) {
          e.state = 'windup';
          e.stateT = 0;
          e.hitDone = false;
        }
      }
    } else if (e.state === 'windup') {
      e.facing = angleLerp(e.facing, ang, Math.min(1, 3 * dt));
      if (e.stateT >= e.windup) {
        e.state = 'active';
        e.stateT = 0;
        e.hitDone = false;
        if (e.ranged) {
          fireEnemyShot(e);
        } else {
          // 矛手突刺：出手瞬间往前捅一截
          if (e.lunge) {
            e.x += Math.cos(e.facing) * e.lunge * 0.55;
            e.y += Math.sin(e.facing) * e.lunge * 0.55;
          }
          addEffect(makeSlashEffect(
            e.x + Math.cos(e.facing) * 40,
            e.y + Math.sin(e.facing) * 40,
            e.facing, '#ff9a6a'
          ));
        }
      }
    } else if (e.state === 'active') {
      if (!e.hitDone && !e.ranged) {
        e.hitDone = true;
        if (d < e.atkRange + 20 && Math.abs(angleDiff(ang, e.facing)) < 1.0) {
          const r = damagePlayer(e.dmg, e.x, e.y, e);
          if (r === 'parry') {
            // 完美格挡把敌人打硬直
            e.state = 'stagger';
            e.stateT = 0;
            e.hitDone = true;
          }
        }
        // 这一下挥砍也会误伤身边的其他敌人
        for (const o of enemies) {
          if (o === e || o.dead) continue;
          if (Math.hypot(o.x - e.x, o.y - e.y) > e.atkRange + o.r + 6) continue;
          const oa = Math.atan2(o.y - e.y, o.x - e.x);
          if (Math.abs(angleDiff(oa, e.facing)) < 1.1) {
            damageEnemy(o, Math.max(1, Math.round(e.dmg * 0.6)), oa, false);
          }
        }
      }
      if (e.stateT >= e.active) {
        e.state = 'recover';
        e.stateT = 0;
      }
    } else if (e.state === 'recover') {
      if (e.stateT >= e.recover) {
        e.state = 'chase';
        e.stateT = 0;
        if (e.ranged) e.shotTimer = e.shotCd;
      }
    }

    resolveObstacles(e);
  }
  pushApart(enemies);
}

// ---------------- 更新：Boss ----------------
function updateBoss(dt) {
  const b = boss;
  if (!b || b.dead) return;
  b.stateT += dt;
  b.flash = Math.max(0, b.flash - dt);
  const d = dist(b, player);
  const ang = Math.atan2(player.y - b.y, player.x - b.x);

  if (b.state === 'dormant') {
    if (d < 620 && !player.dead) {
      b.aggro = true;
      b.state = 'chase';
      b.stateT = 0;
      game.toast = { text: '守墓者 苏醒', t: 2.4 };
      game.shake = 10;
      sfx.bossRoar();
    } else {
      b.facing = ang;
    }
    return;
  }

  if (b.state === 'stagger') {
    if (b.stateT > 0.4) {
      b.state = 'chase';
      b.stateT = 0;
    }
    return;
  }

  if (player.dead) {
    b.state = 'chase';
    b.stateT = 0;
    return;
  }

  // 第二阶段
  if (b.phase === 1 && b.hp < b.maxHp * 0.5) {
    b.phase = 2;
    b.speed = 88;
    b.dmg = 34;
    game.toast = { text: '灰烬燃烧 · 第二阶段', t: 2 };
    game.shake = 12;
    sfx.bossRoar();
    addEffect(makeShockwave(b.x, b.y, '#ff7a3a'));
  }

  switch (b.state) {
    case 'chase': {
      b.facing = ang;
      if (d > 170) {
        b.x += Math.cos(ang) * b.speed * dt;
        b.y += Math.sin(ang) * b.speed * dt;
      }
      if (d < 215 && b.stateT > 0.25) {
        b.stateT = 0;
        b.attackChooser = (b.attackChooser + 1) % 2;
        if (b.phase === 2) b.attackChooser = Math.random() < 0.35 ? 1 : 0;
        if (b.attackChooser === 0) {
          b.state = 'sweepWind';
          b.stateT = 0;
          b.hitDone = false;
        } else {
          b.state = 'slamWind';
          b.stateT = 0;
          b.hitDone = false;
        }
      }
      break;
    }
    case 'sweepWind': {
      b.facing = angleLerp(b.facing, ang, Math.min(1, 2 * dt));
      if (b.stateT >= 0.7) {
        b.state = 'sweepActive';
        b.stateT = 0;
        b.hitDone = false;
        addEffect(makeSlashEffect(
          b.x + Math.cos(b.facing) * 95,
          b.y + Math.sin(b.facing) * 95,
          b.facing, '#ff8a4a', 1.5
        ));
        game.shake = Math.max(game.shake, 9);
      }
      break;
    }
    case 'sweepActive': {
      if (!b.hitDone) {
        b.hitDone = true;
        if (d < 205 && Math.abs(angleDiff(ang, b.facing)) < 1.1) {
          const r = damagePlayer(b.dmg, b.x, b.y, b);
          if (r === 'parry') {
            b.state = 'stagger';
            b.stateT = 0;
          }
        }
      }
      if (b.stateT >= 0.16) {
        b.state = 'recover';
        b.stateT = 0;
      }
      break;
    }
    case 'slamWind': {
      b.facing = angleLerp(b.facing, ang, Math.min(1, 4 * dt));
      if (b.stateT >= 0.55) {
        b.jumpFromX = b.x;
        b.jumpFromY = b.y;
        b.jumpToX = player.x;
        b.jumpToY = player.y;
        b.state = 'slamAir';
        b.stateT = 0;
      }
      break;
    }
    case 'slamAir': {
      const t = clamp(b.stateT / 0.34, 0, 1);
      b.x = lerp(b.jumpFromX, b.jumpToX, t);
      b.y = lerp(b.jumpFromY, b.jumpToY, t);
      if (b.stateT >= 0.34) {
        b.state = 'recover';
        b.stateT = 0;
        game.shake = Math.max(game.shake, 16);
        game.hitStop = 0.04;
        addEffect(makeShockwave(b.x, b.y, '#ffb06a'));
        sfx.hit();
        if (Math.hypot(player.x - b.x, player.y - b.y) < 155) {
          const r = damagePlayer(b.phase === 2 ? 40 : 36, b.x, b.y, b);
          if (r === 'parry') {
            b.state = 'stagger';
            b.stateT = 0;
          }
        }
      }
      break;
    }
    case 'recover': {
      if (b.stateT >= (b.phase === 2 ? 0.7 : 1.0)) {
        b.state = 'chase';
        b.stateT = 0;
      }
      break;
    }
    default: {
      b.state = 'chase';
      b.stateT = 0;
    }
  }

  // 推开玩家
  const dx = player.x - b.x;
  const dy = player.y - b.y;
  const dd = Math.hypot(dx, dy);
  if (dd > 0.001 && dd < b.r + player.r) {
    const push = b.r + player.r - dd;
    player.x += dx / dd * push;
    player.y += dy / dd * push;
  }

  resolveObstacles(b);
}

// ---------------- 更新：血痕 ----------------
function updateBloodstain(dt) {
  if (!bloodstain) return;
  bloodstain.pulse = (bloodstain.pulse || 0) + dt;
  if (!player.dead && dist(player, bloodstain) < 48) {
    player.souls += bloodstain.souls;
    addFloater(bloodstain.x, bloodstain.y - 26, '+' + bloodstain.souls, '#9be7ff');
    sfx.soul();
    bloodstain = null;
  }
}

// ---------------- 相机 ----------------
function updateCamera(dt) {
  const vw = viewW();
  const vh = viewH();
  const targetX = vw >= WORLD.w
    ? (WORLD.w - vw) / 2
    : clamp(player.x - vw / 2, 0, WORLD.w - vw);
  const targetY = vh >= WORLD.h
    ? (WORLD.h - vh) / 2
    : clamp(player.y - vh / 2, 0, WORLD.h - vh);
  const k = 1 - Math.exp(-10 * dt);
  game.camX = lerp(game.camX, targetX, k);
  game.camY = lerp(game.camY, targetY, k);
}

// ---------------- 主更新 ----------------
function update(dt) {
  game.time += dt;
  zoom = lerp(zoom, zoomTarget, Math.min(1, dt * 9));
  if (pressed['zoomin']) bumpZoom(1.12);
  if (pressed['zoomout']) bumpZoom(1 / 1.12);
  game.shake = Math.max(0, game.shake - dt * 45);
  if (game.toast) {
    game.toast.t -= dt;
    if (game.toast.t <= 0) game.toast = null;
  }
  if (game.comboHud) {
    game.comboHud.t -= dt;
    if (game.comboHud.t <= 0) game.comboHud = null;
  }
  if (game.settings) {
    updateSettings(dt);
    return;
  }

  if (game.state === 'menu') {
    updateMenu(dt);
    updateCamera(dt);
    return;
  }

  if (game.state === 'dead') {
    game.deathTimer += dt;
    if (game.deathTimer > 2.8) respawnPlayer();
    updateEffects(dt);
    updateFloaters(dt);
    updateCamera(dt);
    return;
  }

  if (game.state === 'shop') {
    updateShop(dt);
    updateEffects(dt);
    updateFloaters(dt);
    updateCamera(dt);
    return;
  }

  if (game.state === 'victory') {
    game.victoryTimer += dt;
    if (game.victoryTimer > 5.5) game.state = 'playing';
  }

  updatePlayer(dt);
  updateEnemies(dt);
  updateBoss(dt);
  updateProjectiles(dt);
  updateEProjectiles(dt);
  updateBloodstain(dt);
  updateEffects(dt);
  updateFloaters(dt);
  updateCamera(dt);
}

// ---------------- 初始化世界 ----------------
function resetAll() {
  player = makePlayer();
  bossDefeated = false;
  resetEnemies();
  bloodstain = null;
  lockTarget = null;
  game.state = 'playing';
  game.deathTimer = 0;
  game.victoryTimer = 0;
  game.shake = 0;
  game.hitStop = 0;
  game.toast = null;
  game.nearBonfire = false;
  game.nearVendor = false;
  game.shopSel = 0;
  game.shopMsg = null;
  game.shopMsgT = 0;
  game.camX = clamp(player.x - viewW() / 2, 0, Math.max(0, WORLD.w - viewW()));
  game.camY = clamp(player.y - viewH() / 2, 0, Math.max(0, WORLD.h - viewH()));
  floaters = [];
  effects = [];

}

// ================= 像素渲染管线（泰拉瑞亚式观感） =================
const PIXEL = 3;
let lowCanvas = null;
let lowCtx = null;
let lowW = 0;
let lowH = 0;
let G = ctx;

// 视野的世界尺寸（缩放后）
function viewW() { return (lowW || Math.ceil(W / PIXEL)) / zoom; }
function viewH() { return (lowH || Math.ceil(H / PIXEL)) / zoom; }

function initLow() {
  lowW = Math.ceil(W / PIXEL);
  lowH = Math.ceil(H / PIXEL);
  if (!lowCanvas) lowCanvas = document.createElement('canvas');
  lowCanvas.width = lowW;
  lowCanvas.height = lowH;
  lowCtx = lowCanvas.getContext('2d');
  lowCtx.imageSmoothingEnabled = false;
}

function mulberry32(a) {
  return function () {
    a |= 0;
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function px(x, y, w, h, col) {
  G.fillStyle = col;
  G.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

// ---------------- 地面纹理 ----------------
let groundPattern = null;

function makeGroundTexture() {
  const S = 128;
  const c = document.createElement('canvas');
  c.width = S;
  c.height = S;
  const g = c.getContext('2d');
  const rnd = mulberry32(20261027);

  // 基色 + 逐像素亮度噪声（无硬边色块）
  const baseR = 68, baseG = 84, baseB = 52;
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const n = (rnd() - 0.5) * 16;
      const m = (rnd() - 0.5) * 6;
      const r = Math.max(0, Math.min(255, Math.round(baseR + n + m)));
      const gg = Math.max(0, Math.min(255, Math.round(baseG + n)));
      const b = Math.max(0, Math.min(255, Math.round(baseB + n * 0.7 - m)));
      g.fillStyle = 'rgb(' + r + ',' + gg + ',' + b + ')';
      g.fillRect(x, y, 1, 1);
    }
  }

  // 低频柔和暗斑 / 亮斑
  for (let i = 0; i < 22; i++) {
    const cx = rnd() * S, cy = rnd() * S, rad = 10 + rnd() * 26;
    const grd = g.createRadialGradient(cx, cy, 0, cx, cy, rad);
    const dark = rnd() < 0.6;
    grd.addColorStop(0, dark ? 'rgba(20,26,14,0.18)' : 'rgba(150,170,110,0.10)');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd;
    g.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
  }

  // 草叶
  for (let i = 0; i < 210; i++) {
    const bx = Math.floor(rnd() * S);
    const by = Math.floor(rnd() * S);
    const bh = 2 + Math.floor(rnd() * 4);
    g.fillStyle = rnd() < 0.55 ? 'rgba(88,110,62,0.55)' : 'rgba(64,86,46,0.5)';
    g.fillRect(bx, by, 1, bh);
  }
  // 石子
  for (let i = 0; i < 26; i++) {
    g.fillStyle = rnd() < 0.5 ? '#4d4a42' : '#3a382f';
    g.fillRect(Math.floor(rnd() * S), Math.floor(rnd() * S), 2, 2);
  }
  // 枯叶
  for (let i = 0; i < 14; i++) {
    g.fillStyle = rnd() < 0.5 ? '#5b4a2b' : '#6a5730';
    g.fillRect(Math.floor(rnd() * S), Math.floor(rnd() * S), 3, 2);
  }
  return c;
}

// ---------------- 地表装饰 ----------------
const decor = [];
const ashParticles = [];

function buildDecor() {
  decor.length = 0;
  const rnd = mulberry32(77711);
  const farFromBonfire = (x, y, d) => Math.hypot(x - bonfire.x, y - bonfire.y) > d;
  const clearOfPillars = (x, y, d) => {
    for (const o of obstacles) if (Math.hypot(x - o.x, y - o.y) < o.r + d) return false;
    return true;
  };

  for (let i = 0; i < 300; i++) {
    const x = 30 + rnd() * (WORLD.w - 60);
    const y = 30 + rnd() * (WORLD.h - 60);
    if (!farFromBonfire(x, y, 90)) continue;
    decor.push({ type: 'grass', x: x, y: y, s: 0.7 + rnd() * 0.95, seed: rnd() });
  }
  for (let i = 0; i < 80; i++) {
    const x = 40 + rnd() * (WORLD.w - 80);
    const y = 40 + rnd() * (WORLD.h - 80);
    if (!clearOfPillars(x, y, 26)) continue;
    decor.push({ type: 'rock', x: x, y: y, s: 0.6 + rnd() * 0.9, seed: rnd() });
  }
  for (let i = 0; i < 46; i++) {
    const x = 60 + rnd() * (WORLD.w - 120);
    const y = 60 + rnd() * (WORLD.h - 120);
    if (!clearOfPillars(x, y, 20)) continue;
    decor.push({ type: 'shroom', x: x, y: y, s: 0.75 + rnd() * 0.6, seed: rnd() });
  }
  for (let i = 0; i < 18; i++) {
    const x = 120 + rnd() * (WORLD.w - 240);
    const y = 120 + rnd() * (WORLD.h - 240);
    if (!clearOfPillars(x, y, 90) || !farFromBonfire(x, y, 160)) continue;
    decor.push({ type: 'tree', x: x, y: y, s: 0.9 + rnd() * 0.7, seed: rnd() });
  }
  for (let i = 0; i < 16; i++) {
    const x = 140 + rnd() * (WORLD.w - 280);
    const y = 140 + rnd() * (WORLD.h - 280);
    if (!clearOfPillars(x, y, 60)) continue;
    decor.push({ type: 'grave', x: x, y: y, s: 0.95 + rnd() * 0.4, seed: rnd() });
  }
  for (let i = 0; i < 14; i++) {
    const x = 80 + rnd() * (WORLD.w - 160);
    const y = 80 + rnd() * (WORLD.h - 160);
    if (!clearOfPillars(x, y, 40)) continue;
    decor.push({ type: 'bones', x: x, y: y, s: 0.9 + rnd() * 0.5, seed: rnd() });
  }
  decor.sort((a, b) => a.y - b.y);

  ashParticles.length = 0;
  const r2 = mulberry32(3131);
  for (let i = 0; i < 52; i++) {
    ashParticles.push({
      x: r2(), y: r2(),
      s: 0.35 + r2() * 0.9,
      ph: r2() * TAU,
      len: 0.4 + r2() * 0.8
    });
  }
}

function initGraphics() {
  groundPattern = ctx.createPattern(makeGroundTexture(), 'repeat');
  buildDecor();
}

// ---------------- 渲染：背景与世界 ----------------
function drawBackdrop() {
  G.fillStyle = '#14170f';
  G.fillRect(0, 0, lowW, lowH);
  // 远处雾带（屏幕层）
  const g = G.createLinearGradient(0, 0, 0, lowH);
  g.addColorStop(0, 'rgba(32,38,46,0.28)');
  g.addColorStop(0.45, 'rgba(16,19,15,0.06)');
  g.addColorStop(1, 'rgba(10,11,9,0.32)');
  G.fillStyle = g;
  G.fillRect(0, 0, lowW, lowH);
}

function drawFloor() {
  const cx = game.camX;
  const cy = game.camY;
  G.fillStyle = '#080907';
  G.fillRect(cx - 220, cy - 220, W + 440, H + 440);

  G.save();
  G.beginPath();
  G.rect(0, 0, WORLD.w, WORLD.h);
  G.clip();

  G.fillStyle = groundPattern;
  G.fillRect(0, 0, WORLD.w, WORLD.h);

  // 大块暗斑打破平铺感
  const rnd = mulberry32(4242);
  for (let i = 0; i < 110; i++) {
    const x = rnd() * WORLD.w;
    const y = rnd() * WORLD.h;
    const r = 40 + rnd() * 150;
    G.fillStyle = 'rgba(8,10,7,' + (0.06 + rnd() * 0.10).toFixed(3) + ')';
    G.beginPath();
    G.arc(x, y, r, 0, TAU);
    G.fill();
  }

  // 篝火营地：被踩实的土色地面，让场景有「这里有人呆过」的痕迹
  const campR = 190;
  const cg = G.createRadialGradient(bonfire.x, bonfire.y + 6, 18, bonfire.x, bonfire.y + 6, campR);
  cg.addColorStop(0, 'rgba(102,78,52,0.46)');
  cg.addColorStop(0.55, 'rgba(86,68,47,0.24)');
  cg.addColorStop(1, 'rgba(70,56,40,0)');
  G.fillStyle = cg;
  G.beginPath();
  G.arc(bonfire.x, bonfire.y + 6, campR, 0, TAU);
  G.fill();
  const crnd = mulberry32(777);
  for (let i = 0; i < 30; i++) {
    const a = crnd() * TAU;
    const dd = 26 + crnd() * (campR - 36);
    const sx = bonfire.x + Math.cos(a) * dd;
    const sy = bonfire.y + 6 + Math.sin(a) * dd * 0.72;
    const sw = 2 + crnd() * 4;
    G.fillStyle = crnd() > 0.5 ? 'rgba(56,48,36,0.5)' : 'rgba(124,106,76,0.32)';
    G.fillRect(sx, sy, sw, sw * 0.72);
  }

  // 世界边缘渐暗
  const edge = G.createRadialGradient(
    WORLD.w / 2, WORLD.h / 2, 620,
    WORLD.w / 2, WORLD.h / 2, 1750
  );
  edge.addColorStop(0, 'rgba(0,0,0,0)');
  edge.addColorStop(1, 'rgba(0,0,0,0.52)');
  G.fillStyle = edge;
  G.fillRect(0, 0, WORLD.w, WORLD.h);
  G.restore();

  // 边界石带
  G.strokeStyle = 'rgba(90,100,80,0.10)';
  G.lineWidth = 6;
  G.strokeRect(2, 2, WORLD.w - 4, WORLD.h - 4);
}

function visible(x, y, pad) {
  pad = pad || 120;
  return x > game.camX - pad && x < game.camX + viewW() + pad &&
         y > game.camY - pad * 1.6 && y < game.camY + viewH() + pad;
}

function drawShadow(x, y, r) {
  G.save();
  G.globalAlpha = 0.5;
  G.fillStyle = '#000';
  G.beginPath();
  G.ellipse(x, y, r * 0.95, r * 0.4, 0, 0, TAU);
  G.fill();
  G.restore();
}

function drawTree(d) {
  const s = d.s * 1.45;
  const sway = Math.sin(game.time * 1.2 + d.seed * 9) * 1.5;
  // 影子
  G.fillStyle = 'rgba(0,0,0,0.32)';
  G.beginPath();
  G.ellipse(d.x + 6, d.y + 4, 26 * s, 9 * s, 0, 0, TAU);
  G.fill();
  // 树干
  px(d.x - 3 * s, d.y - 34 * s, 6 * s, 36 * s, '#3a2a1c');
  px(d.x - 3 * s, d.y - 34 * s, 2 * s, 36 * s, '#4c3826');
  // 树枝
  px(d.x - 12 * s + sway, d.y - 40 * s, 10 * s, 3 * s, '#3a2a1c');
  px(d.x + 3 * s - sway, d.y - 48 * s, 11 * s, 3 * s, '#3a2a1c');
  // 树冠像素团
  const cx = d.x + sway;
  const cy = d.y - 48 * s;
  const blobs = [
    [0, 0, 15], [-11, 4, 10], [11, 3, 10], [-6, -10, 10], [7, -11, 9], [0, 10, 11]
  ];
  for (const b of blobs) {
    px(cx + b[0] * s - b[2] * s * 0.5, cy + b[1] * s - b[2] * s * 0.5, b[2] * s, b[2] * s * 0.9, '#25402e');
  }
  for (const b of blobs) {
    px(cx + b[0] * s - b[2] * s * 0.42, cy + b[1] * s - b[2] * s * 0.62, b[2] * s * 0.8, b[2] * s * 0.42, '#35583a');
  }
  for (const b of blobs) {
    px(cx + b[0] * s - b[2] * s * 0.28, cy + b[1] * s - b[2] * s * 0.72, b[2] * s * 0.5, b[2] * s * 0.2, '#47713f');
  }
}

function drawDecorItem(d) {
  switch (d.type) {
    case 'grass': {
      const sway = Math.sin(game.time * 1.8 + d.seed * 8) * 1.3;
      const col = d.seed > 0.55 ? '#4c5f33' : (d.seed > 0.25 ? '#40522c' : '#37471f');
      for (let i = 0; i < 3; i++) {
        const ox = (i - 1) * 3 * d.s;
        px(d.x + ox + sway, d.y - (5 + i * 2) * d.s, 1, (5 + i * 2) * d.s, col);
      }
      break;
    }
    case 'rock': {
      const w = 9 * d.s;
      const h = 7 * d.s;
      G.fillStyle = 'rgba(0,0,0,0.3)';
      G.beginPath();
      G.ellipse(d.x + 1, d.y + 2, w * 0.9, h * 0.4, 0, 0, TAU);
      G.fill();
      px(d.x - w / 2, d.y - h, w, h, '#4a4740');
      px(d.x - w / 2, d.y - h, w, 2, '#5c584e');
      px(d.x - w / 2 + 1, d.y - h + 3, w * 0.4, 2, '#3a3833');
      if (d.seed > 0.6) px(d.x - 1, d.y - h + 1, 2, 2, '#5f6b45');
      break;
    }
    case 'shroom': {
      const w = 6 * d.s;
      px(d.x - 0.5, d.y - 6 * d.s, 2, 6 * d.s, '#8a8272');
      px(d.x - w / 2, d.y - 8 * d.s, w, 3 * d.s, d.seed > 0.5 ? '#a8452f' : '#7a3f6a');
      px(d.x - w / 2 + 1, d.y - 8 * d.s, w - 2, 1, '#d0715a');
      break;
    }
    case 'grave': {
      const w = 14 * d.s;
      const h = 20 * d.s;
      G.fillStyle = 'rgba(0,0,0,0.35)';
      G.beginPath();
      G.ellipse(d.x, d.y, w * 0.8, 4, 0, 0, TAU);
      G.fill();
      px(d.x - w / 2, d.y - h, w, h, '#55524b');
      px(d.x - w / 2, d.y - h, w, 2, '#6b675e');
      px(d.x - w / 2 + 2, d.y - h + 4, w - 4, 1, '#3a3833');
      px(d.x - 1, d.y - h + 7, 2, 8, '#3a3833');
      px(d.x - 4, d.y - h + 10, 8, 2, '#3a3833');
      if (d.seed > 0.5) px(d.x + 2, d.y - 4, 3, 4, '#2f3a26');
      break;
    }
    case 'bones': {
      px(d.x - 5, d.y - 3, 10, 2, '#b9b2a0');
      px(d.x - 4, d.y - 1, 8, 1, '#8e8878');
      px(d.x - 1, d.y - 6, 3, 3, '#c6bfae');
      px(d.x + 4, d.y - 5, 2, 5, '#a9a292');
      break;
    }
    default: break;
  }
}

function drawGroundDecor() {
  for (const d of decor) {
    if (!visible(d.x, d.y)) continue;
    if (d.type === 'tree') drawTree(d);
    else drawDecorItem(d);
  }
}

function drawWalls() {
  for (const w of WALLS) {
    if (!visible(w.x + w.w * 0.5, w.y + w.h * 0.5, Math.max(w.w, w.h) * 0.7)) continue;
    const horiz = w.w >= w.h;
    // 落地投影
    G.fillStyle = 'rgba(0,0,0,0.38)';
    G.fillRect(w.x + 6, w.y + 10, w.w, w.h);
    // 墙基
    G.fillStyle = '#2e3136';
    G.fillRect(w.x, w.y, w.w, w.h);
    // 顶面亮带（俯视能看到的厚度）
    if (horiz) {
      G.fillStyle = '#5d646f';
      G.fillRect(w.x, w.y, w.w, 13);
      G.fillStyle = '#767f8d';
      G.fillRect(w.x, w.y, w.w, 5);
    } else {
      G.fillStyle = '#5d646f';
      G.fillRect(w.x, w.y, 13, w.h);
      G.fillStyle = '#767f8d';
      G.fillRect(w.x, w.y, 5, w.h);
    }
    // 石块砌缝
    G.fillStyle = '#3b3f46';
    const blk = 24;
    if (horiz) {
      for (let x = w.x + 2; x < w.x + w.w - 2; x += blk) {
        G.fillRect(x, w.y + 14, Math.min(blk - 3, w.x + w.w - 2 - x), w.h - 18);
      }
      G.fillStyle = 'rgba(14,16,19,0.55)';
      for (let x = w.x + blk; x < w.x + w.w - 2; x += blk) G.fillRect(x - 1, w.y + 14, 2, w.h - 18);
    } else {
      for (let y = w.y + 2; y < w.y + w.h - 2; y += blk) {
        G.fillRect(w.x + 14, y, w.w - 18, Math.min(blk - 3, w.y + w.h - 2 - y));
      }
      G.fillStyle = 'rgba(14,16,19,0.55)';
      for (let y = w.y + blk; y < w.y + w.h - 2; y += blk) G.fillRect(w.x + 14, y - 1, w.w - 18, 2);
    }
    // 背光暗边
    G.fillStyle = 'rgba(0,0,0,0.42)';
    if (horiz) G.fillRect(w.x, w.y + w.h - 4, w.w, 4);
    else G.fillRect(w.x + w.w - 4, w.y, 4, w.h);
    // 顶上苔藓
    G.fillStyle = 'rgba(82,108,70,0.52)';
    if (horiz) {
      for (let x = w.x + 5; x < w.x + w.w - 5; x += 39) G.fillRect(x, w.y - 1, 7, 2);
    } else {
      for (let y = w.y + 5; y < w.y + w.h - 5; y += 39) G.fillRect(w.x - 1, y, 2, 7);
    }
  }
}

function drawObstacles() {
  for (const o of obstacles) {
    if (!visible(o.x, o.y, 160)) continue;
    drawShadow(o.x, o.y + o.r * 0.5, o.r * 1.05);
    if (ART.column) {
      const s = o.r * 1.62;
      G.imageSmoothingEnabled = false;
      G.filter = 'brightness(0.72)';
      G.drawImage(ART.column, o.x - s / 2, o.y - s + 4, s, s);
      G.filter = 'none';
      continue;
    }
    // 石柱主体
    const w = o.r * 1.5;
    const h = o.r * 2.1;
    px(o.x - w / 2, o.y - h * 0.72, w, h, '#3c3a33');
    px(o.x - w / 2, o.y - h * 0.72, w * 0.42, h, '#4a4740');
    px(o.x - w / 2, o.y - h * 0.72, w, 3, '#5a564c');
    // 顶部盖石
    px(o.x - w / 2 - 3, o.y - h * 0.78, w + 6, 6, '#4f4c43');
    // 裂纹
    px(o.x + w * 0.12, o.y - h * 0.5, 2, h * 0.34, '#2b2a25');
    px(o.x - w * 0.28, o.y - h * 0.36, 6, 2, '#2b2a25');
    // 苔藓
    px(o.x - w / 2 + 2, o.y - h * 0.2, 4, 7, '#3a4a2c');
    px(o.x + w / 2 - 6, o.y - h * 0.34, 3, 5, '#33422a');
    // 底部碎石
    px(o.x - w * 0.75, o.y + 2, 7, 4, '#34322c');
    px(o.x + w * 0.35, o.y + 4, 6, 3, '#34322c');
  }
}

function drawBonfire() {
  const b = bonfire;
  const t = game.time;
  // 光晕
  const g = G.createRadialGradient(b.x, b.y - 10, 6, b.x, b.y - 10, 160);
  g.addColorStop(0, 'rgba(255,150,60,0.26)');
  g.addColorStop(0.45, 'rgba(255,120,40,0.09)');
  g.addColorStop(1, 'rgba(255,120,40,0)');
  G.fillStyle = g;
  G.beginPath();
  G.arc(b.x, b.y - 10, 160, 0, TAU);
  G.fill();

  // 石圈
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * TAU;
    px(b.x + Math.cos(a) * 27 - 4, b.y + Math.sin(a) * 12 + 4, 8, 5, i % 2 ? '#3d3a33' : '#4a463c');
  }
  // 木柴
  px(b.x - 15, b.y + 1, 30, 4, '#4a3524');
  px(b.x - 11, b.y - 3, 24, 4, '#573d29');
  // 火苗（像素块跳动）
  const flick = Math.sin(t * 9) * 2;
  const flames = [
    [0, 0, 10, 16, '#ff7a2e'],
    [-2, 1, 6, 12, '#ffa63c'],
    [2, 2, 5, 10, '#ff8c30'],
    [0, 4, 5, 10, '#ffd47a'],
    [-1, 7, 3, 6, '#fff0c0']
  ];
  for (const f of flames) {
    const fh = f[3] + flick * (f[3] / 16);
    px(b.x + f[0] - f[2] / 2, b.y - 10 - fh + f[1], f[2], fh, f[4]);
  }
  // 火星
  for (let i = 0; i < 6; i++) {
    const a = t * 1.4 + i * 1.9;
    const fx = b.x + Math.sin(a) * 16;
    const fy = b.y - 26 - ((t * 30 + i * 42) % 90);
    G.globalAlpha = 0.7 - ((t * 30 + i * 42) % 90) / 120;
    px(fx, fy, 2, 2, '#ffc46a');
    G.globalAlpha = 1;
  }
}

function drawVendor() {
  const v = vendor;
  const t = game.time;

  // 摊位暖光
  const g = G.createRadialGradient(v.x, v.y - 16, 4, v.x, v.y - 16, 98);
  g.addColorStop(0, 'rgba(255,200,120,0.20)');
  g.addColorStop(1, 'rgba(255,200,120,0)');
  G.fillStyle = g;
  G.beginPath();
  G.arc(v.x, v.y - 16, 98, 0, TAU);
  G.fill();

  drawShadow(v.x, v.y + 10, 18);

  // 地毯
  px(v.x - 36, v.y + 8, 72, 7, '#3a2a34');
  px(v.x - 32, v.y + 8, 64, 2, '#5a3a44');

  // 货桌
  px(v.x - 32, v.y - 2, 64, 5, '#3c2c22');
  px(v.x - 32, v.y - 2, 64, 2, '#57402f');
  px(v.x - 32, v.y + 3, 64, 2, '#241a13');
  px(v.x - 28, v.y + 4, 5, 9, '#2c1f18');
  px(v.x + 23, v.y + 4, 5, 9, '#2c1f18');

  // 桌上货品
  const bob = Math.sin(t * 2.4) * 1.2;
  px(v.x - 26, v.y - 10 + bob, 5, 8, '#7fd4ff');
  px(v.x - 26, v.y - 12 + bob, 3, 2, '#c9e8ff');
  px(v.x - 17, v.y - 9 - bob, 5, 7, '#ff8a6a');
  px(v.x - 17, v.y - 11 - bob, 3, 2, '#ffd0b0');
  px(v.x - 7, v.y - 21, 2, 19, '#b8c6d6');
  px(v.x - 9, v.y - 4, 6, 2, '#8a6a34');
  px(v.x - 8, v.y - 2, 4, 6, '#5a4227');
  px(v.x + 5, v.y - 15, 11, 13, '#6a7480');
  px(v.x + 7, v.y - 12, 7, 7, '#8f9aa8');
  px(v.x + 5, v.y - 15, 11, 2, '#8f9aa8');

  // 商人
  const bx = v.x + 20;
  const by = v.y - 5;
  px(bx - 7, by - 9, 14, 15, '#4a3a5a');
  px(bx - 7, by - 9, 14, 2, '#5f4a72');
  px(bx - 3, by - 4, 6, 2, '#8a6a34');
  px(bx - 6, by - 21, 12, 13, '#c8a074');
  px(bx - 6, by - 21, 12, 2, '#d8b48a');
  px(bx - 9, by - 25, 18, 5, '#2e2438');
  px(bx - 4, by - 29, 8, 4, '#3a2e46');
  px(bx - 5, by - 13, 10, 5, '#d8d2c4');
  px(bx - 4, by - 17, 2, 2, '#ffe08a');
  px(bx + 2, by - 17, 2, 2, '#ffe08a');
  // 手臂
  px(bx - 10, by - 6, 3, 8, '#4a3a5a');
  px(bx + 7, by - 6, 3, 8, '#4a3a5a');

  // 交易提示（世界层小图标）
  if (game.nearVendor && game.state !== 'shop') {
    const yy = v.y - 46 + Math.sin(t * 4) * 2;
    px(v.x - 3, yy, 6, 6, '#ffd98a');
    px(v.x - 1, yy + 2, 2, 2, '#3a2a10');
  }
}

function drawBloodstain() {
  if (!bloodstain) return;
  const b = bloodstain;
  const t = game.time;
  const pulse = 0.55 + Math.sin(t * 4) * 0.3;
  const g = G.createRadialGradient(b.x, b.y - 8, 2, b.x, b.y - 8, 70);
  g.addColorStop(0, 'rgba(120,220,255,' + (0.40 * pulse).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(120,220,255,0)');
  G.fillStyle = g;
  G.beginPath();
  G.arc(b.x, b.y - 8, 70, 0, TAU);
  G.fill();
  const bob = Math.sin(t * 3) * 3;
  px(b.x - 5, b.y - 14 + bob, 10, 10, 'rgba(160,235,255,0.55)');
  px(b.x - 3, b.y - 16 + bob, 6, 6, 'rgba(220,250,255,0.9)');
  px(b.x - 1, b.y - 18 + bob, 2, 2, '#ffffff');
}

function drawLighting() {
  G.save();
  G.globalCompositeOperation = 'lighter';
  const p = player;
  if (!p.dead) {
    const g = G.createRadialGradient(p.x, p.y - 6, 6, p.x, p.y - 6, 130);
    g.addColorStop(0, 'rgba(150,180,200,0.20)');
    g.addColorStop(1, 'rgba(120,150,170,0)');
    G.fillStyle = g;
    G.beginPath();
    G.arc(p.x, p.y - 6, 130, 0, TAU);
    G.fill();
  }
  if (boss && !boss.dead && boss.aggro) {
    const col = boss.phase === 2 ? 'rgba(255,70,40,' : 'rgba(160,120,255,';
    const g2 = G.createRadialGradient(boss.x, boss.y, 6, boss.x, boss.y, 150);
    g2.addColorStop(0, col + '0.16)');
    g2.addColorStop(1, col + '0)');
    G.fillStyle = g2;
    G.beginPath();
    G.arc(boss.x, boss.y, 150, 0, TAU);
    G.fill();
  }
  for (const s of projectiles) {
    const g3 = G.createRadialGradient(s.x, s.y, 2, s.x, s.y, 90);
    g3.addColorStop(0, 'rgba(150,235,255,0.35)');
    g3.addColorStop(1, 'rgba(90,180,255,0)');
    G.fillStyle = g3;
    G.beginPath();
    G.arc(s.x, s.y, 90, 0, TAU);
    G.fill();
  }
  G.restore();
}

function drawAmbient() {
  const t = game.time;
  for (const a of ashParticles) {
    const x = ((a.x + t * 0.010 * a.s) % 1) * lowW;
    const y = ((a.y + t * 0.022 * a.s) % 1) * lowH;
    const al = 0.12 + (Math.sin(t * 2.2 + a.ph) * 0.5 + 0.5) * 0.22;
    G.fillStyle = 'rgba(210,200,180,' + al.toFixed(3) + ')';
    G.fillRect(x, y, 1, 1);
  }
}

const ART = {};
const ART_W = {};

function makeWhite(img) {
  try {
    const c = document.createElement('canvas');
    c.width = img.width;
    c.height = img.height;
    const cx = c.getContext('2d');
    cx.drawImage(img, 0, 0);
    cx.globalCompositeOperation = 'source-atop';
    cx.fillStyle = '#ffffff';
    cx.fillRect(0, 0, c.width, c.height);
    return c;
  } catch (e) {
    return null;
  }
}

function loadArt() {
  if (typeof Image === 'undefined') return;
  for (const k of Object.keys(ART_SRC)) {
    const im = new Image();
    im.onload = () => {
      ART[k] = im;
      const w = makeWhite(im);
      if (w) ART_W[k] = w;
    };
    im.src = 'data:image/png;base64,' + ART_SRC[k];
  }
}

// 贴图绘制：脚底对齐、可水平翻转、受击时用白色剪影闪一下
function drawArt(img, x, y, flipX, scale, flash, whiteImg) {
  const s = 32 * (scale || 1);
  G.save();
  G.translate(x, y);
  if (flipX) G.scale(-1, 1);
  if (G.imageSmoothingEnabled !== false) G.imageSmoothingEnabled = false;
  if (!flash) G.filter = 'brightness(0.86)';
  G.drawImage(flash && whiteImg ? whiteImg : img, -s / 2, -s + 7, s, s);
  G.restore();
}

// 手上的兵器：按武器类型分别绘制
function drawWeapon(p, ang) {
  const kind = wpnKind();
  let wx = 0, wy = 0, wrot = 0;
  if (p.state === 'walk') {
    const ph = p.walkPhase;
    const step = Math.abs(Math.sin(ph));
    wx = Math.cos(ph) * 0.8;
    wy = -step * 1.8;
    wrot = Math.sin(ph) * 0.035 * (Math.cos(p.facing) < 0 ? -1 : 1);
  }
  // 锚点固定在角色贴图的「右手」上（贴图里手在左侧、离地约 12 单位），
  // 只让剑的角度绕它转，不再随朝向平移，这样剑柄不会埋进胯部或飘到脚下
  const flipW = Math.cos(p.facing) < 0 ? -1 : 1;
  const ox = p.x - 8 * flipW + wx;
  const oy = p.y - 12 + wy;
  G.save();
  G.translate(ox, oy);
  G.rotate(ang + wrot);
  if (kind === 'spear') {
    px(-9, -1, 31, 3, '#3b4657');
    px(-9, 0, 30, 1, '#8a6a34');
    px(-9, -1, 30, 1, '#a88a58');
    px(13, -2, 7, 5, '#3b4657');
    px(14, -1, 6, 3, '#b6c6d6');
    px(14, 0, 6, 1, '#e8f1f9');
    px(20, 0, 2, 1, '#f2f8fd');
    px(-11, -2, 3, 5, '#6b5232');
  } else if (kind === 'bow') {
    G.strokeStyle = '#3b4657';
    G.lineWidth = 3.5;
    G.beginPath();
    G.arc(3, 0, 9, -1.4, 1.4);
    G.stroke();
    G.strokeStyle = '#a07a42';
    G.lineWidth = 1.8;
    G.beginPath();
    G.arc(3, 0, 9, -1.4, 1.4);
    G.stroke();
    G.strokeStyle = 'rgba(226,236,246,0.8)';
    G.lineWidth = 1;
    G.beginPath();
    G.moveTo(3 + Math.cos(-1.4) * 9, Math.sin(-1.4) * 9);
    G.lineTo(3 + Math.cos(1.4) * 9, Math.sin(1.4) * 9);
    G.stroke();
    if (p.state === 'shoot') {
      G.strokeStyle = 'rgba(200,220,240,0.55)';
      G.beginPath();
      G.moveTo(-2, 0);
      G.lineTo(9, 0);
      G.stroke();
    }
  } else if (kind === 'gun') {
    px(-4, -2, 14, 5, '#3b4657');
    px(-4, -1, 13, 3, '#8e949c');
    px(-4, -1, 13, 1, '#c4cad2');
    px(8, -2, 3, 4, '#3b4657');
    px(-7, 0, 4, 5, '#6b5232');
    px(-7, 4, 4, 2, '#4a3822');
    px(-1, -3, 2, 1, '#5a6470');
    if (p.state === 'shoot' && p.stateT < 0.16) {
      px(11, -1, 4, 3, '#ffe0a0');
      px(15, 0, 3, 1, '#fff2cc');
    }
  } else if (kind === 'shield') {
    // 右边短剑
    px(0, -4, 4, 9, '#3b4657');
    px(3, -2, 12, 5, '#3b4657');
    px(3, -1, 11, 3, '#8e9cae');
    px(3, -1, 11, 1, '#6d7b8d');
    px(3, 1, 11, 1, '#e8f1f9');
    px(13, -1, 3, 2, '#aab8c8');
    // 左手大盾（不跟着武器角度旋转）
    G.rotate(-ang);
    G.save();
    G.translate(-Math.cos(p.facing) * 6 - 8, -Math.sin(p.facing) * 6 + 2);
    G.rotate(p.facing);
    px(-5, -13, 12, 27, '#3b4657');
    px(-4, -12, 10, 25, '#7d8a99');
    px(-4, -12, 10, 2, '#a2b3c4');

    px(-4, -1, 10, 2, '#c9a24a');

  } else {

      // 细刃刺剑：细长、护手小圆盘、整体偏亮青

      px(19, -1, 4, 2, '#e6f2ff');
      px(23, 0, 2, 1, '#ffffff');
    } else if (w === 'great') {
      // 守墓巨剑：宽厚、带血槽、宽护手、柄更长
      px(-9, -3, 9, 7, '#3b4657');
      px(-8, -2, 7, 5, '#5e4722');
      px(-8, -1, 7, 3, '#8a6a34');
      px(0, -5, 4, 11, '#3b4657');
      px(0, -4, 4, 9, '#a08b52');
      px(0, -4, 4, 1, '#d9bf70');
      px(4, -3, 20, 7, '#3b4657');
      px(4, -3, 20, 2, '#b8b09a');
      px(4, -1, 20, 3, '#8f866f');

      px(4, 2, 20, 2, '#d6cdb4');
      px(22, -2, 4, 5, '#c8bfa6');
      px(25, 0, 2, 1, '#efe7d2');
    } else if (w === 'ember') {
      // 余烬之刃：弯刃、暗铁护手、刃口余火
      px(-7, -2, 7, 5, '#241a16');
      px(-6, -1, 5, 3, '#5a3a2a');
      px(-6, 0, 5, 1, '#8a5a3a');
      px(0, -4, 4, 9, '#3a2420');
      px(0, -3, 4, 7, '#7a4a30');

      px(3, -1, 14, 3, '#c0642e');
      px(3, 0, 14, 1, '#ffb070');
      px(6, -2, 10, 1, '#ff8a3a');

      px(21, -2, 2, 1, '#ffe6c0');
    } else {
      // 灰铁长剑（铁剑）
      px(-7, -2, 7, 5, '#3b4657');
      px(0, -4, 4, 9, '#3b4657');
      px(3, -2, 16, 5, '#3b4657');
      px(-6, -1, 5, 3, '#6b5232');
      px(-6, 0, 5, 1, '#8a6a34');
      px(-7, -1, 1, 3, '#2a3140');
      px(0, -3, 3, 8, '#8a6a34');
      px(0, -3, 3, 1, '#d0a94f');

      px(1, -1, 1, 2, '#7fd4ff');

      px(16, -1, 3, 2, '#aab8c8');
